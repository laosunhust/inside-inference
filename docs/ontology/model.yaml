terms:
  ModelArchitecture:
    meaning: Dimensions and numerical conventions that define the supported GPT computation.
    lifetime: Fixed within an identified model artifact.
    owns:
    - Dimensions and numerical conventions that define the supported GPT computation.
    - Declared explanatory stage templates for supported runtimes; these are not captured observations
      or timing.
    excludes:
    - request text
    - generation limits
    - inspection position
    capability_reads: []
    projections: {}
    schemas:
    - ModelArchitecture
    - LlamaArchitecture
    - ArchitectureStage
    - ArchitectureWalkthrough
  KVState:
    meaning: Immutable actual keys and values for a prefix, bound to checkpoint, tokenizer, positions,
      and precision.
    lifetime: Immutable snapshot; continuation creates a new snapshot. Residency is separate.
    owns:
    - Immutable actual keys and values for a prefix, bound to checkpoint, tokenizer, positions, and precision.
    excludes:
    - resource placement
    - cached answers
    - service timing
    capability_reads: []
    projections:
      Sequence state:
        meaning: Actual attention keys and values retained per layer for a token prefix and its positions.
          This declaration represents KV state, not arbitrary recurrent state; weights and cached final
          answers are separate.
        fields:
          KVState:
          - token_ids
          - keys
          - values
          - precision
      State artifact:
        meaning: An identified snapshot or reusable portion of sequence state, tied to the computation
          and input history that produced it. Logical identity is distinct from physical placement.
        fields:
          KVState:
          - checkpoint_sha256
          - tokenizer_sha256
          - token_ids
          - keys
          - values
    schemas:
    - KVState
    - KVStateOperation
    principles:
    - id: kv-append
      when: {}
      equation: 'K^{(\ell)}_{1..i} = \begin{bmatrix} K^{(\ell)}_{1..i-1} \\ k^{(\ell)}_i \end{bmatrix}, \quad V^{(\ell)}_{1..i} = \begin{bmatrix} V^{(\ell)}_{1..i-1} \\ v^{(\ell)}_i \end{bmatrix}'
      symbols:
      - symbol: K^{(\ell)}_{1..i}
        meaning: Keys retained by layer ell for positions 1 through i; earlier rows are reused, never recomputed.
        binds: [operation:retained_keys]
      - symbol: V^{(\ell)}_{1..i}
        meaning: Values retained by layer ell for positions 1 through i.
        binds: [operation:retained_values]
      - symbol: k^{(\ell)}_i
        meaning: Key projected for the newest position.
        binds: [operation:key]
      - symbol: v^{(\ell)}_i
        meaning: Value projected for the newest position.
        binds: [operation:value]
    - id: kv-payload-bytes
      when: {}
      equation: 'B_{KV} = 2 \cdot L \cdot n \cdot d \cdot b'
      symbols:
      - symbol: B_{KV}
        meaning: Logical packed key plus value payload; not process memory.
        binds: []
      - symbol: L
        meaning: Decoder blocks, each retaining its own keys and values.
        binds: [architecture:layers]
      - symbol: n
        meaning: Retained token positions.
        binds: []
      - symbol: d
        meaning: Key or value channels per position, summed over heads.
        binds: [architecture:width]
      - symbol: b
        meaning: Bytes per scalar; the KV simulation packs binary64, so b = 8.
        binds: [architecture:precision]
  ModelArtifact:
    meaning: An immutable inference artifact binding numerical weights to architecture, tokenizer identity,
      and preparation provenance.
    lifetime: Immutable for an artifact identity. Preparation seed is provenance, never a request control.
    owns:
    - The full inference payload and its lightweight identity reference.
    - Preparation provenance attached to the artifact.
    excludes:
    - request text
    - generation limits
    - inspection position
    capability_reads: []
    projections: {}
    schemas:
    - ModelArtifact
    - ModelArtifactReference
    - InitializationProvenance
    - TrainingProvenance
    - ModelAsset
    - ModelStorage
    - ModelDescriptor
    - ModelCatalog
    - ModelSelection
    - ModelLoadResult
    - ModelSource
    - ModelSources
  ModelWeights:
    meaning: 'Numerical tensors consumed by the model: embeddings, projection weights, biases, and normalization
      scales.'
    lifetime: Immutable within its identified artifact or recorded execution.
    owns:
    - Numerical tensor values indexed by model operation; block tensors have an explicit layer axis.
    excludes:
    - Architecture dimensions and execution conventions
    - Request and generation configuration
    - Per-request KV state
    capability_reads: []
    projections: {}
    schemas:
    - ModelWeights
