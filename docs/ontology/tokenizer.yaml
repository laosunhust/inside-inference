terms:
  Tokenizer:
    meaning: The identified vocabulary and codec that frame conversation input and map source bytes to
      inspectable token IDs.
    lifetime: Vocabulary and codec identity are fixed for an encoding; turns are inputs and spans/results
      are recorded evidence.
    owns:
    - Vocabulary entries, role-tagged framing inputs, and the resulting token sequence.
    - Source-byte/token spans and identities required to explain and reproduce encoding.
    - Identity of the token-ID input supplied to model computation; these IDs are not embedding vectors.
    excludes:
    - Embedding vectors and model computation
    - Generation policy and serving decisions
    - Diagnostic output display is not a guarantee that arbitrary generated IDs form valid text.
    capability_reads: []
    projections:
      Tokenizer:
        meaning: Encoding produces token IDs and byte-span evidence under an identified vocabulary and
          codec.
        fields:
          Encoding:
          - ids
          - spans
          - input_sha256
          - manifest_sha256
          - codec_version
      Detokenizer:
        meaning: The recorded output IDs and their diagnostic display under the identified tokenizer.
          Selected IDs remain visible in full. Streaming text exposes only complete UTF-8; a valid pending
          byte triple or UTF-8 suffix is not an error until generation ends. Malformed output remains
          diagnostic; rendering never repairs or filters token choices.
        fields:
          Token:
          - id
          - piece
          - kind
    schemas:
    - Token
    - Turn
    - Span
    - Encoding
    - TokenizerOperation
    principles:
    - id: token-ids
      when: {}
      equation: 't_{1..n} = \operatorname{encode}(\text{text}), \quad t_i \in \{0, \dots, V-1\}'
      symbols:
      - symbol: t_i
        meaning: Vocabulary ID at sequence position i.
        binds: [operation:input_ids]
      - symbol: V
        meaning: Vocabulary size declared by the architecture.
        binds: [architecture:vocabulary]
