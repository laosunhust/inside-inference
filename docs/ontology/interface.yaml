terms:
  InspectionState:
    meaning: One selected position in an identified accepted token sequence, with one shared diagram/detail
      surface and architecture or observation selection. Selection and journey replay never execute inference.
    lifetime: Changes on inspection; reset when input is applied or output is reset. Execution identity
      is null until a computation exists.
    owns:
    - Sequence position shared by token highlighting, derived recorded computation and the next submitted
      raw prefix.
    - Shared diagram/detail focus and journey selection, distinguishing declared architecture from captured
      observations.
    - Executed observation selection; inspecting an operand never changes the generation prefix.
    excludes:
    - input text
    - model or generation configuration
    capability_reads: []
    projections: {}
    schemas:
    - InspectionState
  ApiError:
    meaning: An explicit transport admission or execution failure message.
    lifetime: Produced for a rejected or failed service operation; a completed execution record need not
      exist.
    owns:
    - An explicit transport admission or execution failure message.
    excludes:
    - Successful inference output
    - A structured recovery or retry policy
    - Evidence that an experiment completed
    capability_reads: []
    projections: {}
    schemas:
    - ApiError
