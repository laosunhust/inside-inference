terms:
  RunOutcome:
    meaning: Observed selection and delivery counts, unused budget, and termination reason.
    lifetime: Immutable evidence derived from execution, not requested values.
    owns:
    - Observed selection and delivery counts, unused budget, and termination reason.
    excludes:
    - requested settings
    - playback position
    schema: RunOutcome
    depends_on: []
    capability_reads: []
    projections: {}
  RequestBinding:
    meaning: The model, system, and request consumed by a single numerical trace.
    lifetime: Immutable in an identified execution record.
    owns:
    - The model, system, and request consumed by a single numerical trace.
    excludes:
    - Unrecorded behavior and presentation state
    schema: RequestBinding
    depends_on:
    - InferenceRequest
    - InferenceSystem
    - ModelArtifact
    capability_reads: []
    projections: {}
  RunBinding:
    meaning: The exact model, system, and workload consumed by one execution.
    lifetime: Immutable evidence, including after a later workload draft is edited.
    owns:
    - The exact model, system, and workload consumed by one execution.
    excludes:
    - independent copies of their individual settings
    - presentation state
    schema: RunBinding
    depends_on:
    - InferenceSystem
    - ModelArtifact
    - Workload
    capability_reads: []
    projections: {}
  EventClock:
    meaning: The declared time interpretation for an ordered execution event.
    lifetime: Immutable in an identified execution record.
    owns:
    - The declared time interpretation for an ordered execution event.
    excludes:
    - Unrecorded behavior and presentation state
    schema: EventClock
    depends_on: []
    capability_reads: []
    projections: {}
  RequestArrived:
    meaning: Evidence that a request reached the modeled input boundary.
    lifetime: Immutable in an identified execution record.
    owns:
    - Evidence that a request reached the modeled input boundary.
    excludes:
    - Unrecorded behavior and presentation state
    schema: RequestArrived
    depends_on: []
    capability_reads: []
    projections: {}
  InputEncoded:
    meaning: Evidence identifying the input and resulting token count after encoding.
    lifetime: Immutable in an identified execution record.
    owns:
    - Evidence identifying the input and resulting token count after encoding.
    excludes:
    - Unrecorded behavior and presentation state
    schema: InputEncoded
    depends_on: []
    capability_reads: []
    projections: {}
  WorkCompleted:
    meaning: Evidence linking completed numerical work to its sequence positions.
    lifetime: Immutable in an identified execution record.
    owns:
    - Evidence linking completed numerical work to its sequence positions.
    excludes:
    - Unrecorded behavior and presentation state
    schema: WorkCompleted
    depends_on: []
    capability_reads: []
    projections: {}
  TokenSelected:
    meaning: Evidence linking a selected token to the numerical work that selected it.
    lifetime: Immutable in an identified execution record.
    owns:
    - Evidence linking a selected token to the numerical work that selected it.
    excludes:
    - Unrecorded behavior and presentation state
    schema: TokenSelected
    depends_on: []
    capability_reads: []
    projections: {}
  TokenCommitted:
    meaning: Evidence that selected token IDs became committed continuation state.
    lifetime: Immutable in an identified execution record.
    owns:
    - Evidence that selected token IDs became committed continuation state.
    excludes:
    - Unrecorded behavior and presentation state
    schema: TokenCommitted
    depends_on: []
    capability_reads: []
    projections: {}
  TokenDelivered:
    meaning: Evidence that committed token IDs were published to the modeled output collector.
    lifetime: Immutable in an identified execution record.
    owns:
    - Evidence that committed token IDs were published to the modeled output collector.
    excludes:
    - Unrecorded behavior and presentation state
    schema: TokenDelivered
    depends_on: []
    capability_reads: []
    projections: {}
  RequestFinished:
    meaning: Evidence of the outcome that ended one request.
    lifetime: Immutable in an identified execution record.
    owns:
    - Evidence of the outcome that ended one request.
    excludes:
    - Unrecorded behavior and presentation state
    schema: RequestFinished
    depends_on:
    - RunOutcome
    capability_reads: []
    projections: {}
  RunEvent:
    meaning: An identified ordered occurrence with explicit earlier causes and a typed payload.
    lifetime: Immutable in an identified execution record.
    owns:
    - An identified ordered occurrence with explicit earlier causes and a typed payload.
    excludes:
    - Unrecorded behavior and presentation state
    schema: RunEvent
    depends_on:
    - InputEncoded
    - RequestArrived
    - RequestFinished
    - TokenCommitted
    - TokenDelivered
    - TokenSelected
    - WorkCompleted
    capability_reads: []
    projections:
      Event:
        meaning: A modeled occurrence or transition at a simulation time, linked to causes and affected
          entities. Equal-time events require explicit ordering semantics.
        fields:
          RunEvent:
          - event_id
          - causes
          - payload
  NumericalTrace:
    meaning: Actual single-request tensors, token selections, model binding, and replay evidence.
    lifetime: Immutable in an identified execution record.
    owns:
    - Actual single-request tensors, token selections, model binding, and replay evidence.
    excludes:
    - Unrecorded behavior and presentation state
    schema: NumericalTrace
    depends_on:
    - CodeIdentity
    - DecodingContract
    - Encoding
    - ModelCheckpoint
    - NumericalPass
    - NumericalPrecision
    - RequestBinding
    - RunOutcome
    - Token
    capability_reads: []
    projections:
      Detokenizer:
        meaning: Converts output token IDs back to text or bytes using the tokenizer configuration. A
          streamed token may not complete a printable character; buffering can be required.
        fields:
          NumericalTrace:
          - output_ids
          - output_display
          - tokenizer
  RunRecord:
    meaning: The bound workload and its ordered events and linked numerical traces.
    lifetime: Immutable in an identified execution record.
    owns:
    - The bound workload and its ordered events and linked numerical traces.
    excludes:
    - Unrecorded behavior and presentation state
    schema: RunRecord
    depends_on:
    - EventClock
    - NumericalTrace
    - RunBinding
    - RunEvent
    capability_reads: []
    projections: {}
  TensorObservation:
    meaning: Actual intermediate tensor values with shape, position, operation, and run identity.
    lifetime: Immutable in an identified execution record.
    owns:
    - Actual intermediate tensor values with shape, position, operation, and run identity.
    excludes:
    - Unrecorded behavior and presentation state
    schema: TensorObservation
    depends_on: []
    capability_reads: []
    projections:
      Embedding:
        meaning: Maps token IDs to parameter vectors; position information is applied according to the
          model configuration. These vectors are model inputs, not sequence-state cache entries.
        fields:
          TensorObservation:
          - term
          - name
          - positions
          - values
          - formula
      Transformer layers:
        meaning: Transform position-aware representations through attention, feed-forward operations,
          normalization, and residual paths under the model configuration. Causal attention restricts
          accessible history; execution may read or update sequence state.
        fields:
          TensorObservation:
          - term
          - layer
          - inputs
          - shape
          - values
          - formula
      Output projection:
        meaning: Maps final hidden representations to vocabulary logits. Logits are scores, not selected
          tokens or decoded text.
        fields:
          TensorObservation:
          - term
          - shape
          - values
          - formula
  TokenSelection:
    meaning: Raw logits, probabilities, selection rule, and the selected vocabulary ID.
    lifetime: Immutable in an identified execution record.
    owns:
    - Raw logits, probabilities, selection rule, and the selected vocabulary ID.
    excludes:
    - Unrecorded behavior and presentation state
    schema: TokenSelection
    depends_on: []
    capability_reads: []
    projections:
      Token selection:
        meaning: Chooses a next token from logits under a specified decoding rule, stopping conditions,
          and any randomness. The selected token can feed the next model step.
        fields:
          TokenSelection:
          - raw_logits
          - selected_id
          - rule
  CacheExperiment:
    meaning: A fixed-arrival workload bound to the declared KV execution system.
    lifetime: Immutable within an identified experiment or recorded run.
    owns:
    - A fixed-arrival workload bound to the declared KV execution system.
    excludes:
    - Undeclared behavior
    - Presentation state
    schema: CacheExperiment
    depends_on:
    - CacheSystem
    - Workload
    capability_reads: []
    projections: {}
  CacheEvent:
    meaning: An ordered causal cache or scheduling transition with resource accounting and virtual time.
    lifetime: Immutable within an identified experiment or recorded run.
    owns:
    - An ordered causal cache or scheduling transition with resource accounting and virtual time.
    excludes:
    - Undeclared behavior
    - Presentation state
    schema: CacheEvent
    depends_on: []
    capability_reads: []
    projections:
      Residency:
        meaning: A copy of a state artifact at a location, with allocated size, readiness, and lifetime.
          A remote or in-flight copy is not automatically ready for local computation.
        fields:
          CacheEvent:
          - state_id
          - kind
          - device_reserved_bytes
          - host_retained_bytes
      Queue:
        meaning: Work or requests waiting for eligibility or resources. Being queued is different from
          actively consuming service.
        fields:
          CacheEvent:
          - request_id
          - kind
          - time_us
          - causes
  CacheComputation:
    meaning: Actual numerical work linking its input and output KV states, tensors, selection, and operation
      counts.
    lifetime: Immutable within an identified experiment or recorded run.
    owns:
    - Actual numerical work linking its input and output KV states, tensors, selection, and operation
      counts.
    excludes:
    - Undeclared behavior
    - Presentation state
    schema: CacheComputation
    depends_on:
    - KVState
    - TensorObservation
    - TokenSelection
    capability_reads: []
    projections:
      Work item:
        meaning: A unit of modeled computation or data movement, with prerequisites, inputs, outputs,
          and resource demands. Its granularity is an abstraction choice.
        fields:
          CacheComputation:
          - work_id
          - input_ids
          - nodes
          - state_before
          - state_after
  CacheMeasurement:
    meaning: One local wall-time observation linked to its event and measurement boundary.
    lifetime: Immutable within an identified experiment or recorded run.
    owns:
    - One local wall-time observation linked to its event and measurement boundary.
    excludes:
    - Undeclared behavior
    - Presentation state
    schema: CacheMeasurement
    depends_on: []
    capability_reads: []
    projections: {}
  CacheRun:
    meaning: The complete KV experiment binding, computations, events, outcomes, states, and measurements.
    lifetime: Immutable within an identified experiment or recorded run.
    owns:
    - The complete KV experiment binding, computations, events, outcomes, states, and measurements.
    excludes:
    - Undeclared behavior
    - Presentation state
    schema: CacheRun
    depends_on:
    - CacheBackend
    - CacheComputation
    - CacheEvent
    - CacheExperiment
    - CacheMeasurement
    - KVState
    - ModelCheckpoint
    - RunOutcome
    capability_reads: []
    projections: {}
  CodeIdentity:
    meaning: Runtime and source identities needed to reproduce a numerical execution.
    lifetime: Immutable within its identified artifact or recorded execution.
    owns:
    - Runtime and source identities needed to reproduce a numerical execution.
    excludes:
    - Unrecorded behavior
    - Presentation state
    schema: CodeIdentity
    depends_on: []
    capability_reads: []
    projections: {}
  DecodingContract:
    meaning: Recorded explanation and identifier of the executed token-selection policy.
    lifetime: Immutable within its identified artifact or recorded execution.
    owns:
    - Recorded explanation and identifier of the executed token-selection policy.
    excludes:
    - Unrecorded behavior
    - Presentation state
    schema: DecodingContract
    depends_on: []
    capability_reads: []
    projections: {}
  NumericalPrecision:
    meaning: Declared storage, compute, and accumulation precision of a numerical trace.
    lifetime: Immutable within its identified artifact or recorded execution.
    owns:
    - Declared storage, compute, and accumulation precision of a numerical trace.
    excludes:
    - Unrecorded behavior
    - Presentation state
    schema: NumericalPrecision
    depends_on: []
    capability_reads: []
    projections: {}
  NumericalPass:
    meaning: One actual prediction step with its inputs, positions, tensors, selection, and output progress.
    lifetime: Immutable within its identified artifact or recorded execution.
    owns:
    - One actual prediction step with its inputs, positions, tensors, selection, and output progress.
    excludes:
    - Unrecorded behavior
    - Presentation state
    schema: NumericalPass
    depends_on:
    - TensorObservation
    - TokenSelection
    capability_reads: []
    projections: {}
