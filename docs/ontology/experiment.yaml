terms:
  ExperimentSpec:
    meaning: The declared inputs, configuration, and assumptions for an experiment.
    lifetime: Editable before execution; the consumed specification is frozen in the execution record.
    owns:
    - Submitted experiment input, and resolved bindings identifying the model, inference system, and request
      or workload actually consumed.
    excludes:
    - Observed outcomes and execution identity
    - Causal events and numerical measurements
    depends_on:
    - InferenceRequest
    - InferenceSystem
    - ModelArtifact
    - Workload
    capability_reads: []
    projections: {}
    schemas:
    - RequestBinding
    - RunBinding
    - KVExperimentInput
    - KVRunBinding
  ExperimentExecution:
    meaning: One identified execution of an experiment specification, retaining its events and observations
      for inspection and replay.
    lifetime: Evidence accumulates during execution; the completed record is immutable.
    owns:
    - Execution records joining the consumed specification, events, observations, and request outcomes.
    - Numerical traces and shared execution provenance identifying source bytes, Python/Git version, and
      the actual backend; provenance is distinct from requested system settings.
    excludes:
    - Editable experiment drafts
    - Inspection cursor or playback position
    - Claims that a local run predicts production performance
    depends_on:
    - ExperimentSpec
    - ExperimentEvent
    - ExperimentObservation
    - GenerationPolicy
    - Tokenizer
    - ModelArtifact
    - InferenceResponse
    - ExecutionBackend
    - KVState
    capability_reads: []
    projections:
      Detokenizer:
        meaning: The recorded output IDs and their diagnostic display under the identified tokenizer.
          This view renders word pieces and labeled control/byte/hex IDs; it does not establish valid
          decoded text or a streaming UTF-8 decoder.
        fields:
          NumericalTrace:
          - output_ids
          - output_display
          - tokenizer
    schemas:
    - RunRecord
    - CacheRun
    - NumericalTrace
    - ExecutionProvenance
  ExperimentEvent:
    meaning: An occurrence within an execution, with explicit order, causal links, and the applicable
      clock interpretation.
    lifetime: Recorded when an occurrence happens; earlier events are not rewritten.
    owns:
    - Event envelopes and actual transitions for request arrival, input encoding, model forward completion,
      and token selection.
    - KV residency and scheduling transitions, and the declared interpretation of event time.
    excludes:
    - A global sequential step shared by concurrent requests
    - Inferring causality from adjacency or equal timestamps
    - Treating virtual time or execution order as measured wall time
    - Response publication and completion payloads, owned by InferenceResponse
    depends_on:
    - InferenceResponse
    capability_reads: []
    projections:
      Event:
        meaning: An occurrence linked to its causes and affected entities. The execution declares whether
          order alone or virtual time is available; neither establishes measured duration.
        fields:
          RunEvent:
          - event_id
          - causes
          - payload
      Residency:
        meaning: A copy of a state artifact at a location, with allocated size, readiness, and lifetime.
          A remote or in-flight copy is not automatically ready for local computation.
        fields:
          CacheEvent:
          - state_id
          - kind
          - device_reserved_bytes
          - host_retained_bytes
      Queue:
        meaning: Work or requests waiting for eligibility or resources. Being queued is different from
          actively consuming service.
        fields:
          CacheEvent:
          - request_id
          - kind
          - time_us
          - causes
    schemas:
    - RunEvent
    - CacheEvent
    - EventClock
    - RequestArrived
    - InputEncoded
    - ModelForwardCompleted
    - TokenSelected
  ExperimentObservation:
    meaning: Recorded numerical values or measurements from an execution, associated with the work or
      event they describe.
    lifetime: Captured during execution and retained unchanged with its evidence.
    owns:
    - Intermediate tensors, numerical passes, logits and token selections, and actual KV computations.
    - Declared numerical precision and local wall-time measurements with their measurement boundaries.
    excludes:
    - Requested settings and hypothetical service rates
    - Equating selected tokens with published response tokens
    - Treating a host measurement as target-accelerator performance
    depends_on:
    - KVState
    capability_reads: []
    projections:
      Embedding:
        meaning: Maps token IDs to parameter vectors; position information is applied according to the
          model configuration. These vectors are model inputs, not sequence-state cache entries.
        fields:
          TensorObservation:
          - term
          - name
          - positions
          - values
          - formula
      Transformer layers:
        meaning: Transform position-aware representations through attention, feed-forward operations,
          normalization, and residual paths under the model configuration. Causal attention restricts
          accessible history; execution may read or update sequence state.
        fields:
          TensorObservation:
          - term
          - layer
          - inputs
          - shape
          - values
          - formula
      Output projection:
        meaning: Maps final hidden representations to vocabulary logits. Logits are scores, not selected
          tokens or decoded text.
        fields:
          TensorObservation:
          - term
          - shape
          - values
          - formula
      Token selection:
        meaning: The executed selection from raw logits, with its selected vocabulary ID and recorded
          rule. Current execution uses greedy selection; selecting an ID does not itself mean that it
          was published as output.
        fields:
          TokenSelection:
          - raw_logits
          - selected_id
          - rule
      Work item:
        meaning: An executed KV model computation, identified by work ID and linked to input IDs, tensors,
          and before/after KV states. Transfers are separate events, not instances of this computation
          record.
        fields:
          CacheComputation:
          - work_id
          - input_ids
          - nodes
          - state_before
          - state_after
    schemas:
    - TensorObservation
    - NumericalPass
    - TokenSelection
    - CacheComputation
    - CacheMeasurement
    - NumericalPrecision
