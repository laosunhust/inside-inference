terms:
  ExperimentSpec:
    meaning: One complete selectable experimental configuration, composing workload and execution settings.
    lifetime: Editable before execution; the consumed specification is frozen in the execution record.
    owns:
    - A named configuration of Workload and ExecutionSpec, selected without executing it.
    - The complete input consumed by Interaction; workload and system field meanings remain with their existing owners.
    excludes:
    - Observed outcomes and execution identity
    - Causal events and numerical measurements
    capability_reads: []
    projections: {}
    schemas:
    - ExperimentSpec
  ExperimentExecution:
    meaning: One identified execution of the consumed controls against customer input, retaining its events
      and observations for inspection and replay.
    lifetime: Evidence accumulates during execution; the completed record is immutable.
    owns:
    - Execution records joining the consumed specification, events, observations, and request outcomes.
    - Numerical traces and shared execution provenance identifying source bytes, Python/Git version, and
      the actual backend; provenance is distinct from requested system settings.
    - Resolved model, system and customer-input bindings actually consumed; these are frozen evidence,
      not an independent editable specification.
    excludes:
    - Editable experiment drafts
    - Inspection cursor or playback position
    - Claims that a local run predicts production performance
    capability_reads: []
    projections: {}
    schemas:
    - GenerationEvidence
    - CacheRun
    - ExecutionProvenance
    - ExecutionReplayInput
    - KVRunBinding
    - ResourceExecution
  ExperimentEvent:
    meaning: An occurrence within an execution, with explicit order, causal links, and the applicable
      clock interpretation.
    lifetime: Recorded when an occurrence happens; earlier events are not rewritten.
    owns:
    - Causal cache event envelopes with request identity and virtual timestamps.
    - The current cache event envelope records cross-mechanism scheduling, cache and service transitions;
      it is not their semantic owner.
    excludes:
    - A global sequential step shared by concurrent requests
    - Inferring causality from adjacency or equal timestamps
    - Treating virtual time or execution order as measured wall time
    - Response publication and completion payloads, owned by InferenceResponse
    capability_reads: []
    projections:
      Event:
        meaning: A cache-lab occurrence linked to its causes in declared virtual microseconds, not measured
          wall time.
        fields:
          CacheEvent:
          - event_id
          - causes
          - kind
          - time_us
    schemas:
    - CacheEvent
  ExperimentObservation:
    meaning: Recorded tensors or local measurements attached to executed work; mechanism-specific decisions
      and computations have separate owners.
    lifetime: Captured during execution and retained unchanged with its evidence.
    owns:
    - Recorded intermediate tensors and their dependencies.
    - Local wall-time measurements with their measurement boundaries.
    - Browser token-update observations on a monotonic clock, separated by generation gestures; these are not physical paint timestamps or server benchmarks.
    excludes:
    - Requested settings and hypothetical service rates
    - Equating selected tokens with published response tokens
    - Treating a host measurement as target-accelerator performance
    capability_reads: []
    projections: {}
    schemas:
    - TensorObservation
    - CacheMeasurement
    - GenerationPrediction
    - BrowserTokenTiming
    - BrowserGenerationTiming
    - BrowserObserverBatch
  ExecutionSpec:
    meaning: A composition of experiment controls used together to execute customer input. The list specifies
      one setup, not a sweep.
    lifetime: Editable before execution; retained unchanged with the execution evidence.
    owns:
    - Composition of ontology-bound controls, with one assignment per control.
    - Execution setup independently of customer input and observed results.
    excludes:
    - Customer text and request arrivals, owned by Workload and InferenceRequest
    - Observed outcomes
    - Silently overriding conflicting controls
    capability_reads: []
    projections: {}
    schemas:
    - ExecutionSpec
    - ExecutionControl
    - OntologyBinding
    - GenerationDefaults
  ExperimentDesign:
    meaning: A named investigation, or lab, that tests one question with complete ExperimentSpec variants, states which
      controls it still lacks, and carries its abstraction contract.
    lifetime: Authored with the repository; selecting a variant replaces the editable workload and execution settings before execution.
    owns:
    - The question, ontology subjects, variants and missing controls of one experiment.
    - The abstraction contract and evidence references that bound its conclusions.
    excludes:
    - Execution evidence and observed outcomes, owned by ExperimentExecution
    - Free-form pages or computations outside the declared execution operations
    capability_reads: []
    projections: {}
    schemas:
    - ExperimentDesign
    - AbstractionContract
    - ExperimentSource
    - ExperimentCatalog
