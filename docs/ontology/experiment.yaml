terms:
  ExperimentSpec:
    meaning: The declared inputs, configuration, and assumptions for an experiment.
    lifetime: Editable before execution; the consumed specification is frozen in the execution record.
    owns:
    - Submitted experiment input, and resolved bindings identifying the model, inference system, and request
      or workload actually consumed.
    - Primary and related ontology subjects, resolved against admitted concepts and preserved in execution.
    - Unexecuted configuration previews, kept distinct from resolved execution bindings.
    excludes:
    - Observed outcomes and execution identity
    - Causal events and numerical measurements
    capability_reads: []
    projections: {}
    schemas:
    - RequestBinding
    - RunBinding
    - KVExperimentInput
    - KVRunBinding
    - OntologyBinding
    - ConfigurationPreview
  ExperimentExecution:
    meaning: One identified execution of an experiment specification, retaining its events and observations
      for inspection and replay.
    lifetime: Evidence accumulates during execution; the completed record is immutable.
    owns:
    - Execution records joining the consumed specification, events, observations, and request outcomes.
    - Numerical traces and shared execution provenance identifying source bytes, Python/Git version, and
      the actual backend; provenance is distinct from requested system settings.
    excludes:
    - Editable experiment drafts
    - Inspection cursor or playback position
    - Claims that a local run predicts production performance
    capability_reads: []
    projections: {}
    schemas:
    - RunRecord
    - CacheRun
    - NumericalTrace
    - ExecutionProvenance
  ExperimentEvent:
    meaning: An occurrence within an execution, with explicit order, causal links, and the applicable
      clock interpretation.
    lifetime: Recorded when an occurrence happens; earlier events are not rewritten.
    owns:
    - Causal event envelopes, request arrival and input-encoding payloads, and the declared event clock.
    - The current cache event envelope records cross-mechanism scheduling, cache and service transitions;
      it is not their semantic owner.
    excludes:
    - A global sequential step shared by concurrent requests
    - Inferring causality from adjacency or equal timestamps
    - Treating virtual time or execution order as measured wall time
    - Response publication and completion payloads, owned by InferenceResponse
    capability_reads: []
    projections:
      Event:
        meaning: An occurrence linked to its causes and affected entities. The execution declares whether
          order alone or virtual time is available; neither establishes measured duration.
        fields:
          RunEvent:
          - event_id
          - causes
          - payload
    schemas:
    - RunEvent
    - CacheEvent
    - EventClock
    - RequestArrived
    - InputEncoded
  ExperimentObservation:
    meaning: Recorded tensors or local measurements attached to executed work; mechanism-specific decisions
      and computations have separate owners.
    lifetime: Captured during execution and retained unchanged with its evidence.
    owns:
    - Recorded intermediate tensors and their dependencies.
    - Local wall-time measurements with their measurement boundaries.
    excludes:
    - Requested settings and hypothetical service rates
    - Equating selected tokens with published response tokens
    - Treating a host measurement as target-accelerator performance
    capability_reads: []
    projections: {}
    schemas:
    - TensorObservation
    - CacheMeasurement
