terms:
  Embedding:
    meaning: Look up token vectors and combine the declared input representations.
    lifetime: A model operation identity; observations are captured per execution.
    owns:
    - Look up token vectors and combine the declared input representations.
    excludes:
    - Positional vectors are supplied by PositionEncoding; later attention mixing is separate.
    capability_reads: []
    projections:
      Embedding:
        meaning: Look up token vectors and combine the declared input representations.
        fields:
          EmbeddingOperation:
          - name
    schemas:
    - EmbeddingOperation
    principles:
    - id: embedding-with-learned-positions
      when: {position: learned-absolute}
      equation: 'e_i = E_{t_i}, \quad h^{(0)}_i = e_i + p_i'
      symbols:
      - symbol: e_i
        meaning: Token vector looked up for the ID at position i.
        binds: [operation:token_embedding]
      - symbol: E
        meaning: Token embedding table, one row per vocabulary ID.
        binds: [parameter:token_embedding]
      - symbol: h^{(0)}_i
        meaning: Residual stream entering the first block.
        binds: [operation:embedding]
      - symbol: p_i
        meaning: Learned vector for absolute position i.
        binds: [operation:position_embedding]
    - id: embedding-without-position-vector
      when: {position: rope}
      equation: 'h^{(0)}_i = e_i = E_{t_i}'
      symbols:
      - symbol: e_i
        meaning: Token vector looked up for the ID at position i; position is applied later by rotating queries and keys.
        binds: [operation:token_embedding]
      - symbol: E
        meaning: Token embedding table, one row per vocabulary ID.
        binds: [parameter:token_embedding]
  PositionEncoding:
    meaning: Represent sequence position according to the model architecture; the current implementation
      uses learned absolute vectors.
    lifetime: A model operation identity; observations are captured per execution.
    owns:
    - Represent sequence position according to the model architecture; the current implementation uses
      learned absolute vectors.
    excludes:
    - Does not establish extrapolation or compatibility when a mechanism is replaced.
    capability_reads: []
    projections:
      Positional encoding:
        meaning: Represent sequence position according to the model architecture; the current implementation
          uses learned absolute vectors.
        fields:
          PositionEncodingOperation:
          - name
    schemas:
    - PositionEncodingOperation
    principles:
    - id: learned-absolute-position
      when: {position: learned-absolute}
      equation: 'p_i = P_i, \quad 0 \le i < n_{\max}'
      symbols:
      - symbol: p_i
        meaning: Position vector added to the token vector.
        binds: [operation:position_embedding]
      - symbol: P
        meaning: Learned position table, one row per position.
        binds: [parameter:position_embedding]
      - symbol: n_{\max}
        meaning: Context capacity; positions beyond it have no learned row.
        binds: [architecture:context]
    - id: rotary-position
      when: {position: rope}
      equation: '\begin{bmatrix} \tilde{q}_{2j} \\ \tilde{q}_{2j+1} \end{bmatrix} = \begin{bmatrix} \cos i\theta_j & -\sin i\theta_j \\ \sin i\theta_j & \cos i\theta_j \end{bmatrix} \begin{bmatrix} q_{2j} \\ q_{2j+1} \end{bmatrix}, \quad \theta_j = 10000^{-2j/d_h}'
      symbols:
      - symbol: \tilde{q}
        meaning: Query channel pair after rotation by position i; keys are rotated identically, values are not.
        binds: []
      - symbol: q_{2j}
        meaning: Projected query channel before rotation; 2j indexes channels within one head.
        binds: [operation:query, operation:key]
      - symbol: \theta_j
        meaning: Rotation frequency of channel pair j.
        binds: []
      - symbol: d_h
        meaning: Channels per head, width divided by heads.
        binds: [architecture:width, architecture:heads]
  Normalization:
    meaning: Normalize channels using the declared statistics, epsilon, scale, and bias.
    lifetime: A model operation identity; observations are captured per execution.
    owns:
    - Normalize channels using the declared statistics, epsilon, scale, and bias.
    excludes:
    - Does not own residual addition or feed-forward projections.
    capability_reads: []
    projections:
      Normalization:
        meaning: Normalize channels using the declared statistics, epsilon, scale, and bias.
        fields:
          NormalizationOperation:
          - name
    schemas:
    - NormalizationOperation
    principles:
    - id: layer-normalization
      when: {normalization: pre-layernorm}
      equation: '\mu = \frac{1}{d}\sum_{c=1}^{d} x_c, \quad \sigma^2 = \frac{1}{d}\sum_{c=1}^{d} (x_c - \mu)^2, \quad y = \frac{x - \mu}{\sqrt{\sigma^2 + \epsilon}} \odot \gamma + \beta'
      symbols:
      - symbol: x
        meaning: Residual stream row entering the normalization.
        binds: []
      - symbol: \mu
        meaning: Channel mean of one row.
        binds: [operation:ln1_mean, operation:ln2_mean, operation:ln_final_mean]
      - symbol: \sigma^2
        meaning: Population variance over channels; divides by d, not d - 1.
        binds: [operation:ln1_variance, operation:ln2_variance, operation:ln_final_variance]
      - symbol: y
        meaning: Normalized row passed to the next branch.
        binds: [operation:ln1, operation:ln2, operation:ln_final]
      - symbol: \gamma
        meaning: Learned per-channel scale.
        binds: [parameter:ln1_scale, parameter:ln2_scale, parameter:ln_final_scale]
      - symbol: \beta
        meaning: Learned per-channel bias.
        binds: [parameter:ln1_bias, parameter:ln2_bias, parameter:ln_final_bias]
      - symbol: \epsilon
        meaning: Stabilizer that keeps the denominator nonzero.
        binds: [architecture:epsilon]
      - symbol: d
        meaning: Channels per position.
        binds: [architecture:width]
    - id: rms-normalization
      when: {normalization: rmsnorm}
      equation: 'y = \frac{x}{\sqrt{\frac{1}{d}\sum_{c=1}^{d} x_c^2 + \epsilon}} \odot \gamma'
      symbols:
      - symbol: x
        meaning: Residual stream row; no mean is subtracted and no bias is added.
        binds: []
      - symbol: y
        meaning: Normalized row passed to the next branch.
        binds: [operation:ln1, operation:ln2, operation:ln_final]
      - symbol: \gamma
        meaning: Learned per-channel scale.
        binds: [parameter:ln1_scale, parameter:ln2_scale, parameter:ln_final_scale]
      - symbol: \epsilon
        meaning: Stabilizer that keeps the denominator nonzero.
        binds: [architecture:epsilon]
      - symbol: d
        meaning: Channels per position.
        binds: [architecture:width]
  Attention:
    meaning: Query and mix sequence information, using accessible key/value history or a recurrent summary.
      The GPT baseline implements causal softmax attention.
    lifetime: A model operation identity; observations are captured per execution.
    owns:
    - Query-based sequence mixing and the state-update rule of recurrent attention.
    excludes:
    - KVState owns numerical K/V payloads; KVCache owns retention and reuse management.
    - Position mechanisms are owned by PositionEncoding.
    capability_reads: []
    projections:
      Attention:
        meaning: Query and mix sequence information. The declared GPT operations implement causal softmax
          attention; the standalone KDA lab illustrates a recurrent update.
        fields:
          AttentionOperation:
          - name
    schemas:
    - AttentionOperation
    principles:
    - id: qkv-projection
      when: {}
      equation: 'q_i = y_i W_Q + b_Q, \quad k_i = y_i W_K + b_K, \quad v_i = y_i W_V + b_V'
      symbols:
      - symbol: y_i
        meaning: Normalized row at position i.
        binds: [operation:ln1]
      - symbol: q_i
        meaning: Query; with rotary positions it is rotated before scoring.
        binds: [operation:query, parameter:query]
      - symbol: k_i
        meaning: Key; retained for later positions.
        binds: [operation:key, parameter:key]
      - symbol: v_i
        meaning: Value; retained for later positions.
        binds: [operation:value, parameter:value]
      - symbol: b_Q
        meaning: Projection bias; Llama-family checkpoints have none.
        binds: [parameter:query_bias, parameter:key_bias, parameter:value_bias]
    - id: causal-attention
      when: {}
      equation: 's^{(h)}_{ij} = \frac{q^{(h)}_i \cdot k^{(h)}_j}{\sqrt{d_h}} + m_{ij}, \quad m_{ij} = \begin{cases} 0 & j \le i \\ -\infty & j > i \end{cases}'
      symbols:
      - symbol: s^{(h)}_{ij}
        meaning: Score of query position i against key position j in head h.
        binds: [operation:scores]
      - symbol: m_{ij}
        meaning: Causal mask; a position never reads a later position.
        binds: [operation:causal_mask]
      - symbol: d_h
        meaning: Channels per head, width divided by heads.
        binds: [architecture:width, architecture:heads]
    - id: stable-softmax
      when: {}
      equation: 'a^{(h)}_{ij} = \frac{\exp\left(s^{(h)}_{ij} - M_i\right)}{\sum_{r \le i} \exp\left(s^{(h)}_{ir} - M_i\right)}, \quad M_i = \max_{r \le i} s^{(h)}_{ir}'
      symbols:
      - symbol: a^{(h)}_{ij}
        meaning: Attention weight; each row sums to one over visible positions.
        binds: [operation:attention]
      - symbol: M_i
        meaning: Row maximum subtracted before exponentiation; it cancels mathematically and prevents overflow.
        binds: []
    - id: value-mixing
      when: {}
      equation: 'u^{(h)}_i = \sum_{j \le i} a^{(h)}_{ij}\, v^{(h)}_j, \quad o_i = \left[u^{(1)}_i; \dots; u^{(H)}_i\right] W_O + b_O'
      symbols:
      - symbol: u^{(h)}_i
        meaning: Weighted sum of visible values, concatenated over heads.
        binds: [operation:weighted_values]
      - symbol: o_i
        meaning: Attention branch output.
        binds: [operation:attention_output, parameter:attention_output]
      - symbol: b_O
        meaning: Output projection bias; Llama-family checkpoints have none.
        binds: [parameter:attention_output_bias]
      - symbol: H
        meaning: Attention heads.
        binds: [architecture:heads]
  ResidualAddition:
    meaning: Add a branch output to its preserved residual input.
    lifetime: A model operation identity; observations are captured per execution.
    owns:
    - Add a branch output to its preserved residual input.
    excludes:
    - Does not own either branch computation or normalization.
    capability_reads: []
    projections:
      Residual addition:
        meaning: Add a branch output to its preserved residual input.
        fields:
          ResidualAdditionOperation:
          - name
    schemas:
    - ResidualAdditionOperation
    principles:
    - id: residual-addition
      when: {}
      equation: 'x^{\mathrm{attn}}_i = x_i + o_i, \quad x^{\mathrm{ff}}_i = x^{\mathrm{attn}}_i + f_i'
      symbols:
      - symbol: x^{\mathrm{attn}}_i
        meaning: Residual stream after adding the attention branch.
        binds: [operation:attention_residual]
      - symbol: x^{\mathrm{ff}}_i
        meaning: Residual stream after adding the feed-forward branch; input to the next block.
        binds: [operation:ff_residual]
      - symbol: o_i
        meaning: Attention branch output.
        binds: [operation:attention_output]
      - symbol: f_i
        meaning: Feed-forward branch output.
        binds: [operation:ff_down]
  FeedForward:
    meaning: Apply per-position channel projections and the declared activation.
    lifetime: A model operation identity; observations are captured per execution.
    owns:
    - Apply per-position channel projections and the declared activation.
    excludes:
    - Does not mix token positions or own residual addition.
    capability_reads: []
    projections:
      Feed forward:
        meaning: Apply per-position channel projections and the declared activation.
        fields:
          FeedForwardOperation:
          - name
    schemas:
    - FeedForwardOperation
    principles:
    - id: gelu-feed-forward
      when: {activation: gelu-tanh}
      equation: 'z_i = y_i W_1 + b_1, \quad g(z) = \tfrac{1}{2} z \left(1 + \tanh\left(\sqrt{2/\pi}\,(z + 0.044715\, z^3)\right)\right), \quad f_i = g(z_i) W_2 + b_2'
      symbols:
      - symbol: z_i
        meaning: Expanded hidden row.
        binds: [operation:ff_up, parameter:ff_up]
      - symbol: g(z)
        meaning: Tanh approximation of GELU, applied per channel.
        binds: [operation:gelu]
      - symbol: f_i
        meaning: Feed-forward branch output.
        binds: [operation:ff_down, parameter:ff_down]
      - symbol: y_i
        meaning: Normalized row at position i.
        binds: [operation:ln2]
    - id: silu-gated-feed-forward
      when: {activation: silu-gated}
      equation: 'z_i = y_i W_1, \quad r_i = y_i W_3, \quad \operatorname{SiLU}(z) = \frac{z}{1 + e^{-z}}, \quad f_i = \left(\operatorname{SiLU}(z_i) \odot r_i\right) W_2'
      symbols:
      - symbol: z_i
        meaning: Activated projection.
        binds: [operation:ff_up]
      - symbol: r_i
        meaning: Linear gate projection multiplied channel by channel.
        binds: []
      - symbol: \operatorname{SiLU}(z)
        meaning: Sigmoid-weighted linear unit.
        binds: []
      - symbol: f_i
        meaning: Feed-forward branch output.
        binds: [operation:ff_down]
      - symbol: y_i
        meaning: Normalized row at position i.
        binds: [operation:ln2]
  OutputProjection:
    meaning: Project final hidden vectors to vocabulary scores.
    lifetime: A model operation identity; observations are captured per execution.
    owns:
    - Project final hidden vectors to vocabulary scores.
    excludes:
    - Does not select, deliver, or decode output tokens.
    capability_reads: []
    projections:
      Output projection:
        meaning: Project final hidden vectors to vocabulary scores.
        fields:
          OutputProjectionOperation:
          - name
    schemas:
    - OutputProjectionOperation
    principles:
    - id: vocabulary-logits
      when: {}
      equation: 'z_v = y_n W_{\mathrm{out}} + b_{\mathrm{out}} \in \mathbb{R}^{V}'
      symbols:
      - symbol: z_v
        meaning: One score per vocabulary ID; decoding selects from these.
        binds: [operation:logits, parameter:lm_head]
      - symbol: y_n
        meaning: Final normalized row of the last position.
        binds: [operation:ln_final]
      - symbol: W_{\mathrm{out}}
        meaning: Output weights; Llama-family checkpoints reuse the token embedding table.
        binds: [parameter:lm_head]
      - symbol: b_{\mathrm{out}}
        meaning: Output bias; Llama-family checkpoints have none.
        binds: [parameter:lm_bias]
      - symbol: V
        meaning: Vocabulary size.
        binds: [architecture:vocabulary]
