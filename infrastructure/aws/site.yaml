AWSTemplateFormatVersion: '2010-09-09'
Description: Inside Inference static browser release delivery; shared dev/prod template.
Parameters:
  Hostname:
    Type: String
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  Enabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  Release:
    Type: String
    Default: unpublished
    AllowedPattern: 'unpublished|[0-9a-f]{64}'
Conditions:
  Serving: {Fn::Equals: [{Ref: Enabled}, 'true']}
Resources:
  Assets:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: {Ref: Hostname}
      ValidationMethod: DNS
      DomainValidationOptions:
      - DomainName: {Ref: Hostname}
        HostedZoneId: {Ref: HostedZoneId}
  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: {Fn::Sub: '${AWS::StackName}-s3'}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  ReleasePointer:
    Type: AWS::CloudFront::Function
    Properties:
      Name: {Fn::Sub: '${AWS::StackName}-release'}
      AutoPublish: true
      FunctionConfig:
        Comment: Resolve clean documents internally; asset URLs retain their content identity.
        Runtime: cloudfront-js-2.0
      FunctionCode:
        Fn::Sub: |
          function handler(event) {
            var request = event.request;
            if ('${Enabled}' !== 'true') return {statusCode: 403, statusDescription: 'Disabled'};
            if ('${Release}' === 'unpublished') {
              return {statusCode: 503, statusDescription: 'Not published',
                headers: {'cache-control': {value: 'no-store'}}};
            }
            var pages = {'/': 'index.html', '/ontology/': 'ontology/index.html',
                         '/declarations/': 'declarations/index.html'};
            if (pages[request.uri]) {
              request.uri = '/releases/${Release}/' + pages[request.uri];
              return request;
            }
            if (/^\/assets\/[0-9a-f]{64}\/[^.]/.test(request.uri) && !/\.html$/.test(request.uri)) {
              request.uri = '/releases' + request.uri;
              return request;
            }
            // Existing tabs may still request assets from the former release layout.
            if (/^\/releases\/[0-9a-f]{64}\//.test(request.uri) && !/\.html$/.test(request.uri)) return request;
            return {statusCode: 404, statusDescription: 'Not Found',
              headers: {'cache-control': {value: 'no-store'}}};
          }

  Headers:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: {Fn::Sub: '${AWS::StackName}-headers'}
        SecurityHeadersConfig:
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: strict-origin-when-cross-origin, Override: true}
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            Override: true
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: {Fn::Sub: 'Inside Inference ${Hostname}'}
        Enabled: {Fn::If: [Serving, true, false]}
        IPV6Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases:
        - {Ref: Hostname}
        Origins:
        - Id: assets
          DomainName: {Fn::GetAtt: [Assets, RegionalDomainName]}
          OriginAccessControlId: {Ref: OriginAccess}
          S3OriginConfig:
            OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: assets
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: {Ref: Headers}
          FunctionAssociations:
          - EventType: viewer-request
            FunctionARN: {Fn::GetAtt: [ReleasePointer, FunctionARN]}
        ViewerCertificate:
          AcmCertificateArn: {Ref: Certificate}
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
  ReadPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: {Ref: Assets}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal: {Service: cloudfront.amazonaws.com}
          Action: s3:GetObject
          Resource: {Fn::Sub: '${Assets.Arn}/releases/*'}
          Condition:
            StringEquals:
              AWS:SourceArn: {Fn::Sub: 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'}
  IPv4:
    Condition: Serving
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: {Ref: HostedZoneId}
      Name: {Ref: Hostname}
      Type: A
      AliasTarget:
        DNSName: {Fn::GetAtt: [Distribution, DomainName]}
        HostedZoneId: Z2FDTNDATAQYW2
  IPv6:
    Condition: Serving
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: {Ref: HostedZoneId}
      Name: {Ref: Hostname}
      Type: AAAA
      AliasTarget:
        DNSName: {Fn::GetAtt: [Distribution, DomainName]}
        HostedZoneId: Z2FDTNDATAQYW2
Outputs:
  Bucket:
    Value: {Ref: Assets}
  DistributionId:
    Value: {Ref: Distribution}
  DistributionHostname:
    Value: {Fn::GetAtt: [Distribution, DomainName]}
  Hostname:
    Value: {Ref: Hostname}
  Release:
    Value: {Ref: Release}
