$defs:
  ArtifactReference:
    type: object
    x-owner: ExperimentExecution
    additionalProperties: false
    required:
    - schema
    - sha256
    properties:
      schema:
        type: string
        enum:
        - ExecutionArchive
        - TensorTable
        - ModelArtifact
        - VocabularyArtifact
      sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
  ExecutionReceipt:
    type: object
    x-owner: ExperimentExecution
    additionalProperties: false
    required:
    - execution_id
    - archive
    properties:
      execution_id:
        type: string
      archive:
        $ref: '#/$defs/ArtifactReference'
  ArtifactResponse:
    type: object
    x-owner: ExperimentExecution
    additionalProperties: false
    required:
    - reference
    - content
    properties:
      reference:
        $ref: '#/$defs/ArtifactReference'
      content:
        type: string
        description: Canonical JSON bytes decoded as UTF-8; must match the referenced digest and
          declared schema before consumption.
  TensorTable:
    type: object
    x-owner: ExperimentObservation
    additionalProperties: false
    required:
    - rows
    properties:
      rows:
        type: array
        items:
          type: array
          items:
            type:
            - number
            - boolean
  VocabularyArtifact:
    type: object
    x-owner: Tokenizer
    additionalProperties: false
    required:
    - tokens
    properties:
      tokens:
        type: array
        items:
          $ref: '#/$defs/Token'
  StoredTensorObservation:
    type: object
    properties:
      axes:
        type: array
        items:
          type: string
      dtype:
        type: string
      formula:
        type: string
      id:
        type: string
      inputs:
        type: array
        items:
          type: string
      layer:
        type:
        - integer
        - 'null'
      positions:
        type: array
        items:
          type: integer
      request_id:
        type: string
      run_id:
        type: string
      shape:
        type: array
        items:
          type: integer
      step:
        type: integer
      values:
        type: array
        items:
          type: integer
          minimum: 0
      operation:
        anyOf:
        - $ref: '#/$defs/EmbeddingOperation'
        - $ref: '#/$defs/PositionEncodingOperation'
        - $ref: '#/$defs/NormalizationOperation'
        - $ref: '#/$defs/AttentionOperation'
        - $ref: '#/$defs/ResidualAdditionOperation'
        - $ref: '#/$defs/FeedForwardOperation'
        - $ref: '#/$defs/OutputProjectionOperation'
        - $ref: '#/$defs/TokenizerOperation'
        - $ref: '#/$defs/KVStateOperation'
    required:
    - axes
    - dtype
    - formula
    - id
    - inputs
    - layer
    - positions
    - request_id
    - run_id
    - shape
    - step
    - values
    - operation
    additionalProperties: false
    x-owner: ExperimentObservation
  StoredTokenSelection:
    type: object
    properties:
      decoding:
        type: string
      probabilities:
        type: integer
        minimum: 0
      raw_logits:
        type: integer
        minimum: 0
      rng_state:
        type: 'null'
      rule:
        type: string
        const: unmasked-greedy-v1
      selected_id:
        type: integer
    required:
    - decoding
    - probabilities
    - raw_logits
    - rng_state
    - rule
    - selected_id
    additionalProperties: false
    x-owner: Decoding
  StoredNumericalPass:
    type: object
    properties:
      display_so_far:
        type: string
        description: Diagnostic token display; raw IDs are authoritative. Control, byte, and hex
          IDs appear as labeled markers.
      execution:
        type: string
      id:
        type: string
      input_ids:
        type: array
        items:
          type: integer
      nodes:
        type: array
        items:
          $ref: '#/$defs/StoredTensorObservation'
      output_position:
        type: integer
      phase:
        type: string
      positions:
        type: array
        items:
          type: integer
      request_id:
        type: string
      run_id:
        type: string
      selection:
        $ref: '#/$defs/StoredTokenSelection'
      selection_position:
        type: integer
      step:
        type: integer
    required:
    - display_so_far
    - execution
    - id
    - input_ids
    - nodes
    - output_position
    - phase
    - positions
    - request_id
    - run_id
    - selection
    - selection_position
    - step
    additionalProperties: false
    x-owner: Decoding
  StoredNumericalTrace:
    type: object
    properties:
      checkpoint:
        $ref: '#/$defs/ArtifactReference'
      provenance:
        $ref: '#/$defs/ExecutionProvenance'
      contract_sha256:
        type: string
      declaration:
        $ref: '#/$defs/RequestBinding'
      decoding_contract:
        $ref: '#/$defs/DecodingContract'
      evidence:
        type: string
      format:
        type: string
        const: naive-gpt-run-v2
      id:
        type: string
      outcome:
        $ref: '#/$defs/RunOutcome'
      output_ids:
        type: array
        items:
          type: integer
      output_display:
        type: string
        description: Diagnostic token display; raw IDs are authoritative. Control, byte, and hex
          IDs appear as labeled markers.
      passes:
        type: array
        items:
          $ref: '#/$defs/StoredNumericalPass'
      precision:
        $ref: '#/$defs/NumericalPrecision'
      request_id:
        type: string
      sequence_ids:
        type: array
        items:
          type: integer
      tokenizer:
        $ref: '#/$defs/Encoding'
      vocabulary:
        $ref: '#/$defs/ArtifactReference'
    required:
    - checkpoint
    - provenance
    - contract_sha256
    - declaration
    - decoding_contract
    - evidence
    - format
    - id
    - outcome
    - output_ids
    - output_display
    - passes
    - precision
    - request_id
    - sequence_ids
    - tokenizer
    - vocabulary
    additionalProperties: false
    x-owner: ExperimentExecution
  StoredRunRecord:
    type: object
    x-owner: ExperimentExecution
    additionalProperties: false
    required:
    - format
    - id
    - contract_sha256
    - declaration
    - clock
    - events
    - traces
    properties:
      format:
        type: string
        title: Run format
        description: Run format
        const: workload-run-v1
        default: workload-run-v1
      id:
        type: string
        title: Run identity
        description: Run identity
        pattern: ^[0-9a-f]{64}$
      contract_sha256:
        type: string
        title: Contract identity
        description: Contract identity
        pattern: ^[0-9a-f]{64}$
      declaration:
        $ref: '#/$defs/RunBinding'
      clock:
        $ref: '#/$defs/EventClock'
      events:
        type: array
        title: Ordered execution events
        description: Ordered execution events
        items:
          $ref: '#/$defs/RunEvent'
        minItems: 1
      traces:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/StoredNumericalTrace'
  StoredTokenStepResult:
    type: object
    x-owner: ExperimentExecution
    additionalProperties: false
    required:
    - id
    - contract_sha256
    - request
    - checkpoint
    - provenance
    - output_ids
    - sequence_ids
    - remaining_tokens
    - stop_reason
    - computation
    properties:
      id:
        type: string
      contract_sha256:
        type: string
      request:
        $ref: '#/$defs/TokenStepRequest'
      checkpoint:
        $ref: '#/$defs/ArtifactReference'
      provenance:
        $ref: '#/$defs/ExecutionProvenance'
      output_ids:
        type: array
        items:
          type: integer
          minimum: 0
          maximum: 383
      sequence_ids:
        type: array
        items:
          type: integer
          minimum: 0
          maximum: 383
      remaining_tokens:
        type: integer
        minimum: 0
      stop_reason:
        type:
        - string
        - 'null'
        enum:
        - null
        - turn_end
        - output_budget
      computation:
        $ref: '#/$defs/StoredNumericalPass'
  ExecutionArchive:
    type: object
    x-owner: ExperimentExecution
    additionalProperties: false
    required:
    - record
    - tensors
    properties:
      record:
        oneOf:
        - $ref: '#/$defs/StoredRunRecord'
        - $ref: '#/$defs/StoredTokenStepResult'
      tensors:
        $ref: '#/$defs/ArtifactReference'
  ExecutionBundle:
    type: object
    x-owner: ExperimentExecution
    additionalProperties: false
    required:
    - receipt
    - objects
    properties:
      receipt:
        $ref: '#/$defs/ExecutionReceipt'
      objects:
        type: object
        additionalProperties:
          $ref: '#/$defs/ArtifactResponse'
