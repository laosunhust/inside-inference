$defs:
  InferenceMap:
    type: object
    x-owner: InferenceSystem
    additionalProperties: false
    required:
    - nodes
    - relationships
    properties:
      nodes:
        type: array
        items:
          $ref: '#/$defs/InferenceMapNode'
        minItems: 1
      relationships:
        type: array
        items:
          $ref: '#/$defs/InferenceMapRelationship'
    description: One containment hierarchy shared by configuration and explanation. Node presence declares
      a logical responsibility, not executable support. Relationships cross boundaries without creating
      second parents.
    const:
      nodes:
      - id: system
        parent: null
        owner: InferenceSystem
        kind: component
        view: concept
        expanded: true
      - id: endpoint
        parent: system
        owner: RequestEndpoint
        kind: component
        view: concept
        expanded: false
      - id: request
        parent: endpoint
        owner: InferenceRequest
        kind: artifact
        view: concept
        expanded: false
      - id: workload
        parent: endpoint
        owner: Workload
        kind: artifact
        view: concept
        expanded: false
      - id: response
        parent: endpoint
        owner: InferenceResponse
        kind: artifact
        view: concept
        expanded: false
      - id: router
        parent: system
        owner: RequestRouter
        kind: component
        view: concept
        expanded: false
      - id: engine
        parent: system
        owner: InferenceEngine
        kind: component
        view: concept
        expanded: true
      - id: model
        parent: engine
        owner: ModelArtifact
        kind: artifact
        view: concept
        expanded: false
      - id: weights
        parent: model
        owner: ModelWeights
        kind: artifact
        view: concept
        expanded: false
      - id: architecture
        parent: model
        owner: ModelArchitecture
        kind: artifact
        view: concept
        expanded: false
      - id: scheduler
        parent: engine
        owner: RequestScheduling
        kind: mechanism
        view: concept
        expanded: false
      - id: tokenizer
        parent: engine
        owner: Tokenizer
        kind: mechanism
        view: concept
        expanded: false
      - id: executor
        parent: engine
        owner: ModelExecution
        kind: component
        view: engine
        expanded: true
      - id: embedding
        parent: executor
        owner: Embedding
        kind: mechanism
        view: concept
        expanded: false
      - id: position
        parent: executor
        owner: PositionEncoding
        kind: mechanism
        view: concept
        expanded: false
      - id: normalization
        parent: executor
        owner: Normalization
        kind: mechanism
        view: concept
        expanded: false
      - id: attention
        parent: executor
        owner: Attention
        kind: mechanism
        view: concept
        expanded: false
      - id: residual
        parent: executor
        owner: ResidualAddition
        kind: mechanism
        view: concept
        expanded: false
      - id: feed-forward
        parent: executor
        owner: FeedForward
        kind: mechanism
        view: concept
        expanded: false
      - id: projection
        parent: executor
        owner: OutputProjection
        kind: mechanism
        view: concept
        expanded: false
      - id: decoding
        parent: engine
        owner: Decoding
        kind: mechanism
        view: concept
        expanded: false
      - id: state
        parent: system
        owner: StateManager
        kind: component
        view: concept
        expanded: false
      - id: kv-state
        parent: state
        owner: KVState
        kind: mechanism
        view: concept
        expanded: false
      - id: kv-cache
        parent: state
        owner: KVCache
        kind: mechanism
        view: concept
        expanded: false
      - id: transfer
        parent: state
        owner: StateTransfer
        kind: mechanism
        view: concept
        expanded: false
      - id: backend
        parent: system
        owner: ExecutionBackend
        kind: component
        view: concept
        expanded: false
      - id: kernel
        parent: backend
        owner: ComputeKernel
        kind: mechanism
        view: concept
        expanded: false
      - id: device-runtime
        parent: backend
        owner: DeviceRuntime
        kind: mechanism
        view: concept
        expanded: false
      - id: collectives
        parent: backend
        owner: CollectiveCommunication
        kind: mechanism
        view: concept
        expanded: false
      - id: resources
        parent: system
        owner: ResourcePool
        kind: component
        view: concept
        expanded: false
      - id: topology
        parent: resources
        owner: ResourceGraph
        kind: artifact
        view: concept
        expanded: false
      - id: compute
        parent: resources
        owner: ComputeService
        kind: mechanism
        view: concept
        expanded: false
      relationships:
      - source: endpoint
        target: router
        label: Submits to
      - source: router
        target: engine
        label: Dispatches to
      - source: engine
        target: endpoint
        label: Publishes through
      - source: router
        target: state
        label: Consults residency in
      - source: executor
        target: state
        label: Reads and writes
      - source: executor
        target: backend
        label: Executes through
      - source: backend
        target: resources
        label: Runs on
      - source: state
        target: resources
        label: Occupies
  InferenceMapNode:
    type: object
    x-owner: InferenceSystem
    additionalProperties: false
    required:
    - id
    - parent
    - owner
    - kind
    - view
    - expanded
    properties:
      id:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
      parent:
        type:
        - string
        - 'null'
      owner:
        type: string
        x-ontology-reference: true
      kind:
        type: string
        enum:
        - component
        - artifact
        - mechanism
      view:
        type: string
        enum:
        - concept
        - engine
      expanded:
        type: boolean
    oneOf:
    - $ref: '#/$defs/RequestEndpointBoundary'
    - $ref: '#/$defs/RequestRouterBoundary'
    - $ref: '#/$defs/InferenceEngineBoundary'
    - $ref: '#/$defs/StateManagerBoundary'
    - $ref: '#/$defs/ResourcePoolBoundary'
    - $ref: '#/$defs/ComputeKernelBoundary'
    - $ref: '#/$defs/DeviceRuntimeBoundary'
    - $ref: '#/$defs/CollectiveCommunicationBoundary'
    - not:
        properties:
          owner:
            enum:
            - RequestEndpoint
            - RequestRouter
            - InferenceEngine
            - StateManager
            - ResourcePool
            - ComputeKernel
            - DeviceRuntime
            - CollectiveCommunication
  InferenceMapRelationship:
    type: object
    x-owner: InferenceSystem
    additionalProperties: false
    required:
    - source
    - target
    - label
    properties:
      source:
        type: string
      target:
        type: string
      label:
        type: string
  RequestEndpointBoundary:
    type: object
    x-owner: RequestEndpoint
    additionalProperties: false
    required:
    - id
    - parent
    - owner
    - kind
    - view
    - expanded
    properties:
      id:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
      parent:
        type:
        - string
        - 'null'
      owner:
        type: string
        const: RequestEndpoint
        x-ontology-reference: true
      kind:
        type: string
        const: component
      view:
        type: string
        enum:
        - concept
        - engine
      expanded:
        type: boolean
  RequestRouterBoundary:
    type: object
    x-owner: RequestRouter
