$defs:
  CacheComputation:
    type: object
    x-owner: ModelExecution
    additionalProperties: false
    required:
    - work_id
    - request_id
    - step
    - input_ids
    - state_before
    - state_after
    - nodes
    - selection
    - matmul_flops
    - logical_memory_bytes
    - reference_max_abs_error
    - phase
    - reference_matmul_flops
    properties:
      work_id:
        type: string
      request_id:
        type: string
      step:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      input_ids:
        type: array
        items:
          type: integer
          minimum: 0
          maximum: 383
      state_before:
        $ref: '#/$defs/KVState'
      state_after:
        $ref: '#/$defs/KVState'
      nodes:
        type: array
        items:
          $ref: '#/$defs/TensorObservation'
      selection:
        oneOf:
        - $ref: '#/$defs/TokenSelection'
        - type: 'null'
      matmul_flops:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      logical_memory_bytes:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      reference_max_abs_error:
        type: number
        minimum: 0
      phase:
        type: string
        enum:
        - cache-build
        - prefill
        - decode
      reference_matmul_flops:
        type: integer
        minimum: 0
  TokenSelection:
    type: object
    properties:
      decoding:
        type: string
      probabilities:
        type: array
        items:
          type: number
      raw_logits:
        type: array
        items:
          type: number
      rng_state:
        type: 'null'
      rule:
        type: string
        const: unmasked-greedy-v1
      selected_id:
        type: integer
    required:
    - decoding
    - probabilities
    - raw_logits
    - rng_state
    - rule
    - selected_id
    additionalProperties: false
    x-owner: Decoding
