$defs:
  ExecutionBackend:
    type: object
    x-owner: ExecutionBackend
    additionalProperties: false
    required:
    - compute_device
    - device_state_storage
    - host_state_storage
    - library
    - precision
    properties:
      compute_device:
        type: string
      device_state_storage:
        type: string
      host_state_storage:
        type: string
      library:
        type: string
      precision:
        type: string
  ResourceNode:
    type: object
    x-owner: ResourceGraph
    additionalProperties: false
    required:
    - id
    - memory_capacity_bytes
    - compute_flops_per_us
    - memory_bytes_per_us
    properties:
      id:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
      memory_capacity_bytes:
        type: integer
        minimum: 1
      compute_flops_per_us:
        type: number
        minimum: 0.001
      memory_bytes_per_us:
        type: number
        minimum: 0.001
  ResourceLink:
    type: object
    x-owner: ResourceGraph
    additionalProperties: false
    required:
    - id
    - source
    - target
    - bandwidth_bytes_per_us
    - startup_us
    properties:
      id:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
      source:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
      target:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
      bandwidth_bytes_per_us:
        type: number
        minimum: 0.001
      startup_us:
        type: number
        minimum: 0
  ResourceGraph:
    type: object
    x-owner: ResourceGraph
    additionalProperties: false
    required:
    - basis
    - nodes
    - links
    properties:
      basis:
        type: string
        const: hypothetical
      nodes:
        type: array
        items:
          $ref: '#/$defs/ResourceNode'
        minItems: 1
      links:
        type: array
        items:
          $ref: '#/$defs/ResourceLink'
