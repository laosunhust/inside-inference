$defs:
  ModelAsset:
    type: object
    x-owner: ModelArtifact
    additionalProperties: false
    required:
    - path
    - sha256
    - bytes
    properties:
      path:
        type: string
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._/-]*$
      sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
      bytes:
        type: integer
        minimum: 1
  ModelStorage:
    type: object
    x-owner: ModelArtifact
    additionalProperties: false
    required:
    - base_url
    properties:
      base_url:
        type: string
        description: Relative URL or HTTP(S) object-storage prefix; identical fetch protocol locally and
          remotely.
        pattern: '[\s\S]+'
  LlamaArchitecture:
    type: object
    x-owner: ModelArchitecture
    additionalProperties: false
    required:
    - vocabulary
    - width
    - ffn
    - context
    - layers
    - heads
    - position
    - normalization
    - activation
    - precision
    - epsilon
    properties:
      vocabulary:
        type: integer
        const: 4096
      width:
        type: integer
        enum:
        - 64
        - 256
      ffn:
        type: integer
        enum:
        - 192
        - 704
      context:
        type: integer
        const: 512
      layers:
        type: integer
        const: 4
      heads:
        type: integer
        enum:
        - 2
        - 8
      position:
        type: string
        const: rope
      normalization:
        type: string
        const: rmsnorm
      activation:
        type: string
        const: silu-gated
      precision:
        type: string
        const: binary32
      epsilon:
        type: number
        const: 1.0e-05
  ModelDescriptor:
    type: object
    x-owner: ModelArtifact
    additionalProperties: false
    required:
    - id
    - label
    - role
    - parameters
    - architecture
    - weights
    - tokenizer
    - seed
    - inspection
    - stop_ids
    - normalization
    - provenance
    - weight_format
    - tokenizer_format
    properties:
      id:
        type: string
        pattern: ^[a-z0-9-]+$
      label:
        type: string
        pattern: '[\s\S]+'
      role:
        type: string
        enum:
        - inspection
        - comparison
        - continuation
      parameters:
        type: integer
        minimum: 1
      architecture:
        oneOf:
        - $ref: '#/$defs/ModelArchitecture'
        - $ref: '#/$defs/LlamaArchitecture'
      weights:
        $ref: '#/$defs/ModelAsset'
      tokenizer:
        $ref: '#/$defs/ModelAsset'
      seed:
        type: integer
        minimum: 0
      inspection:
        type: string
        enum:
        - tensors
        - logits
      stop_ids:
        type: array
        items:
          type: integer
          minimum: 0
        minItems: 1
      normalization:
        type: string
        enum:
        - exact
        - sentencepiece-identity-collapse-spaces
      provenance:
        type: string
        pattern: '[\s\S]+'
      weight_format:
        type: string
        enum:
        - naive-gpt-json
        - llama2c-binary
      tokenizer_format:
        type: string
        enum:
        - word-hex-manifest
        - sentencepiece-binary
  ModelCatalog:
    type: object
    x-owner: ModelArtifact
    additionalProperties: false
    required:
    - storage
    - models
    properties:
      storage:
        $ref: '#/$defs/ModelStorage'
      models:
        type: array
        items:
          $ref: '#/$defs/ModelDescriptor'
        minItems: 1
  ModelSelection:
    type: object
    x-owner: ModelArtifact
    additionalProperties: false
    required:
    - model_id
    properties:
      model_id:
        type: string
        pattern: '[\s\S]+'
  ModelLoadResult:
    type: object
    x-owner: ModelArtifact
    additionalProperties: false
    required:
    - model
    - load_ms
    - token_pieces
    - parameters
    properties:
      model:
        $ref: '#/$defs/ModelDescriptor'
      load_ms:
        type: number
        minimum: 0
      token_pieces:
        type: array
        minItems: 384
        maxItems: 4096
        items:
          type: string
      parameters:
        oneOf:
        - $ref: '#/$defs/ModelWeights'
        - type: 'null'
  GenerationInput:
    type: object
    x-owner: InferenceRequest
    additionalProperties: false
    required:
    - execution
    - workload
    properties:
      execution:
        $ref: '#/$defs/ExecutionSpec'
      workload:
        $ref: '#/$defs/Workload'
  GenerationPrepared:
    type: object
    x-owner: InferenceRequest
    additionalProperties: false
    required:
    - prompt_ids
    - pieces
    - input
    - encoding
    properties:
      prompt_ids:
        type: array
        items:
          type: integer
          minimum: 0
        minItems: 1
        maxItems: 512
      pieces:
        type: array
        items:
          type: string
        minItems: 1
        maxItems: 512
      input:
        $ref: '#/$defs/GenerationInput'
      encoding:
        oneOf:
        - $ref: '#/$defs/Encoding'
        - type: 'null'
  GenerationStep:
    type: object
    x-owner: InferenceRequest
    additionalProperties: false
    required:
    - execution
    - prefix_ids
    - output_ids
    - generation
    properties:
      execution:
        $ref: '#/$defs/ExecutionSpec'
      prefix_ids:
        type: array
        items:
          type: integer
          minimum: 0
        minItems: 1
        maxItems: 512
      output_ids:
        type: array
        items:
          type: integer
          minimum: 0
        maxItems: 128
      generation:
        $ref: '#/$defs/GenerationPolicy'
  GenerationPrediction:
    type: object
    x-owner: ExperimentObservation
    additionalProperties: false
    required:
    - model_id
    - weights_sha256
    - tokenizer_sha256
    - sequence_ids
    - output_ids
    - text
    - pieces
    - logits
    - selected_id
    - stop_reason
    - decoder_ms
    - service_ms
    - nodes
    - decoding_note
    - request
    - id
    - contract_sha256
    - probabilities
    - work
    properties:
      model_id:
        type: string
      weights_sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
      tokenizer_sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
      sequence_ids:
        type: array
        items:
          type: integer
          minimum: 0
        minItems: 2
        maxItems: 513
      output_ids:
        type: array
        items:
          type: integer
          minimum: 0
        minItems: 1
        maxItems: 128
      text:
        type: string
      pieces:
        type: array
        items:
          type: string
        minItems: 2
        maxItems: 513
      logits:
        type: array
        items:
          type: number
        minItems: 384
        maxItems: 4096
      selected_id:
        type: integer
        minimum: 0
      stop_reason:
        type:
        - string
        - 'null'
        enum:
        - null
        - end_token
        - output_budget
        - context_capacity
      decoder_ms:
        type: number
        minimum: 0
        description: Worker perf_counter duration around Decoder.run, including the model capability's tensor capture. Excludes selection, decoding and serialization.
      service_ms:
        type: number
        minimum: 0
        description: Worker perf_counter duration from immediately before Decoder.run through response construction, including selection, decoding, pieces and observation construction. Excludes input admission and JSON serialization. Nested decoder duration is included; no cross-domain timestamp arithmetic.
      nodes:
        type: array
        items:
          $ref: '#/$defs/TensorObservation'
      decoding_note:
        type:
        - string
        - 'null'
        description: Malformed output or incomplete terminal encoding. Valid pending byte or UTF-8 prefixes
          while generation can continue have no diagnostic.
      request:
        $ref: '#/$defs/GenerationStep'
      id:
        type: string
        pattern: ^[0-9a-f]{64}$
      contract_sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
      probabilities:
        type: array
        items:
          type: number
          minimum: 0
          maximum: 1
        minItems: 384
        maxItems: 4096
      work:
        $ref: '#/$defs/GenerationWork'
  ModelSource:
    type: object
    x-owner: ModelArtifact
    additionalProperties: false
    required:
    - id
    - role
    - seed
    - provenance
    - weights
    - tokenizer
    - weight_format
    - tokenizer_format
    properties:
      id:
        type: string
        pattern: ^[a-z0-9-]+$
      role:
        type: string
        enum:
        - inspection
        - comparison
        - continuation
      seed:
        type: integer
        minimum: 0
      provenance:
        type: string
        pattern: '[\s\S]+'
      weights:
        type: string
        pattern: ^[a-z0-9][a-z0-9.-]*\.bin$
      tokenizer:
        type: string
        pattern: ^[a-z0-9][a-z0-9.-]*\.bin$
      weight_format:
        type: string
        enum:
        - naive-gpt-json
        - llama2c-binary
      tokenizer_format:
        type: string
        enum:
        - word-hex-manifest
        - sentencepiece-binary
  ModelSources:
    type: object
    x-owner: ModelArtifact
    additionalProperties: false
    required:
    - storage
    - models
    properties:
      storage:
        $ref: '#/$defs/ModelStorage'
      models:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/ModelSource'
  GenerationDefaults:
    type: object
    x-owner: ExecutionSpec
    additionalProperties: false
    required:
    - execution
    - workload
    properties:
      execution:
        $ref: '#/$defs/ExecutionSpec'
      workload:
        $ref: '#/$defs/Workload'
  GenerationEvidence:
    type: object
    x-owner: ExperimentExecution
    additionalProperties: false
    required:
    - timing
    - input
    - model
    - prediction
    properties:
      timing:
        $ref: '#/$defs/BrowserGenerationTiming'
      input:
        $ref: '#/$defs/GenerationInput'
      model:
        $ref: '#/$defs/ModelDescriptor'
      prediction:
        $ref: '#/$defs/GenerationPrediction'
  ArchitectureWalkthrough:
    type: object
    x-owner: ModelArchitecture
    additionalProperties: false
    required:
    - stages
    properties:
      stages:
        type: array
        items:
          $ref: '#/$defs/ArchitectureStage'
    const:
      stages:
      - owner: Tokenizer
        label: Token IDs
        scope: prefix
        detail: Text is encoded into vocabulary IDs.
        inputs: []
        operations:
        - input_ids
        related: []
        inspection: input_ids
      - owner: Embedding
        label: Embedding
        scope: prefix
        detail: Look up token vectors. Learned absolute positions, when configured, are added here.
        inputs:
        - 0
        operations:
        - token_embedding
        - position_embedding
        - embedding
        related:
        - PositionEncoding
        inspection: token_embedding
      - owner: Normalization
        label: Normalize
        scope: layer
        detail: Normalize channels using the declared model normalization.
        inputs:
        - 1
        operations:
        - ln1_mean
        - ln1_variance
        - ln1
        related: []
        inspection: ln1
      - owner: Attention
        label: Attention
        scope: layer
        detail: Project Q/K/V, apply positional rotation when configured, mix causal values, and project
          the result.
        inputs:
        - 2
        operations:
        - query
        - key
        - value
        - retained_keys
        - retained_values
        - scores
        - causal_mask
        - attention
        - weighted_values
        - attention_output
        related:
        - PositionEncoding
        - KVState
        inspection: attention
      - owner: ResidualAddition
        label: +
        scope: layer
        detail: Add the attention branch to its input.
        inputs:
        - 1
        - 3
        operations:
        - attention_residual
        related: []
        inspection: attention_residual
      - owner: Normalization
        label: Normalize
        scope: layer
        detail: Normalize channels using the declared model normalization.
        inputs:
        - 4
        operations:
        - ln2_mean
        - ln2_variance
        - ln2
        related: []
        inspection: ln2
      - owner: FeedForward
        label: Feed-forward
        scope: layer
        detail: Project, apply the declared activation, and project back.
        inputs:
        - 5
        operations:
        - ff_up
        - gelu
        - ff_down
        related: []
        inspection: ff_up
      - owner: ResidualAddition
        label: +
        scope: layer
        detail: Add the feed-forward branch to its input.
        inputs:
        - 4
        - 6
        operations:
        - ff_residual
        related: []
        inspection: ff_residual
      - owner: Normalization
        label: Final norm
        scope: suffix
        detail: Normalize the final hidden vector.
        inputs:
        - 7
        operations:
        - ln_final_mean
        - ln_final_variance
        - ln_final
        related: []
        inspection: ln_final
      - owner: OutputProjection
        label: Vocabulary projection
        scope: suffix
        detail: Project hidden vectors into one logit per vocabulary ID.
        inputs:
        - 8
        operations:
        - logits
        related: []
        inspection: logits
  ArchitectureStage:
    type: object
    x-owner: ModelArchitecture
    additionalProperties: false
    required:
    - owner
    - label
    - scope
    - detail
    - inputs
    - operations
    - related
    - inspection
    properties:
      owner:
        type: string
        x-ontology-reference: true
      label:
        type: string
        pattern: '[\s\S]+'
      scope:
        type: string
        enum:
        - prefix
        - layer
        - suffix
      detail:
        type: string
        pattern: '[\s\S]+'
      inputs:
        type: array
        items:
          type: integer
          minimum: 0
        description: Earlier stage indices in this single-block schematic; residual branches remain explicit.
      operations:
        type: array
        items:
          type: string
        minItems: 1
      related:
        type: array
        items:
          type: string
          x-ontology-reference: true
      inspection:
        type: string
  ExecutionControl:
    type: object
    x-owner: ExecutionSpec
    additionalProperties: false
    required:
    - control
    - value
    - ontology_binding
    properties:
      control:
        type: string
        enum:
        - model
        - kv_reuse
        - kv_cache
        - scheduling
        - transfer
        - compute_service
      value:
        type:
        - string
        - boolean
        - object
      ontology_binding:
        $ref: '#/$defs/OntologyBinding'
    oneOf:
    - properties:
        control:
          const: model
        value:
          type: string
          pattern: ^[a-z0-9-]+$
          title: Model
        ontology_binding:
          const:
            primary: ModelArtifact
            related: []
    - properties:
        control:
          const: kv_reuse
        value:
          type: boolean
          title: KV reuse
        ontology_binding:
          const:
            primary: KVCache
            related:
            - ModelExecution
    - properties:
        control:
          const: kv_cache
        value:
          $ref: '#/$defs/KVCacheConfig'
        ontology_binding:
          const:
            primary: KVCache
            related:
            - KVState
    - properties:
        control:
          const: scheduling
        value:
          $ref: '#/$defs/RequestSchedulingConfig'
        ontology_binding:
          const:
            primary: RequestScheduling
            related: []
    - properties:
        control:
          const: transfer
        value:
          $ref: '#/$defs/StateTransferConfig'
        ontology_binding:
          const:
            primary: StateTransfer
            related:
            - KVState
    - properties:
        control:
          const: compute_service
        value:
          $ref: '#/$defs/ComputeServiceConfig'
        ontology_binding:
          const:
            primary: ComputeService
            related: []
  ExecutionSpec:
    type: object
    x-owner: ExecutionSpec
    additionalProperties: false
    required:
    - experiments
    properties:
      experiments:
        type: array
        minItems: 2
        maxItems: 6
        items:
          $ref: '#/$defs/ExecutionControl'
        allOf:
        - contains:
            type: object
            properties:
              control:
                const: model
            required:
            - control
          maxContains: 1
        - contains:
            type: object
            properties:
              control:
                const: kv_reuse
            required:
            - control
          maxContains: 1
        - if:
            anyOf:
            - contains:
                type: object
                properties:
                  control:
                    const: scheduling
                required:
                - control
            - contains:
                type: object
                properties:
                  control:
                    const: kv_cache
                required:
                - control
            - contains:
                type: object
                properties:
                  control:
                    const: transfer
                required:
                - control
            - contains:
                type: object
                properties:
                  control:
                    const: compute_service
                required:
                - control
          then:
            allOf:
            - contains:
                type: object
                properties:
                  control:
                    const: scheduling
                required:
                - control
              maxContains: 1
            - contains:
                type: object
                properties:
                  control:
                    const: kv_cache
                required:
                - control
              maxContains: 1
            - contains:
                type: object
                properties:
                  control:
                    const: transfer
                required:
                - control
              maxContains: 1
            - contains:
                type: object
                properties:
                  control:
                    const: compute_service
                required:
                - control
              maxContains: 1
    description: Exactly one model and one KV reuse assignment. The implemented resource simulation additionally
      requires cache, scheduling, transfer and compute-service controls together; partial and duplicate
      assignments fail before execution.
  GenerationWork:
    type: object
    x-owner: ModelExecution
    additionalProperties: false
    required:
    - processed_positions
    - reused_positions
    - matmul_flops
    properties:
      processed_positions:
        type: integer
        minimum: 0
        maximum: 512
      reused_positions:
        type: integer
        minimum: 0
        maximum: 512
      matmul_flops:
        type: integer
        minimum: 0
        maximum: 9007199254740991
        description: Executed dense and attention matrix multiply/add operations, counted as two FLOPs
          per multiply-add. Excludes normalization, activation and softmax.
  ResourceExecution:
    type: object
    x-owner: ExperimentExecution
    additionalProperties: false
    required:
    - input
    - run
    - outputs
    - decoding_notes
    properties:
      input:
        $ref: '#/$defs/GenerationInput'
      run:
        $ref: '#/$defs/CacheRun'
      outputs:
        type: object
        additionalProperties:
          type: string
      decoding_notes:
        type: object
        additionalProperties:
          type: string
        description: Request-indexed malformed or incomplete decoding diagnostics; output text remains
          unmodified.
