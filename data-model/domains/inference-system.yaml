$defs:
  InferenceSystem:
    type: object
    x-owner: InferenceSystem
    additionalProperties: false
    required:
    - execution
    - max_new_tokens_cap
    - max_requests
    - arrival_policy
    properties:
      execution:
        type: string
        title: Execution strategy
        description: Supported baseline value.
        const: full-prefix-recomputation
        default: full-prefix-recomputation
      max_new_tokens_cap:
        type: integer
        title: Supported new-token limit
        description: Supported baseline value.
        const: 8
        default: 8
      max_requests:
        type: integer
        title: Supported request count
        description: Supported request count
        minimum: 0
        maximum: 9007199254740991
        const: 1
        default: 1
      arrival_policy:
        type: string
        title: Supported arrivals
        description: Supported arrivals
        const: single-at-zero
        default: single-at-zero
  GenerationPolicy:
    type: object
    x-owner: GenerationPolicy
    additionalProperties: false
    required:
    - max_new_tokens
    - selection
    - stopping
    properties:
      max_new_tokens:
        type: integer
        title: Maximum new tokens
        description: An upper bound on selected IDs, including TURN_END. Generation may stop earlier.
        minimum: 1
        default: 6
        x-maximum-from: system.max_new_tokens_cap
      selection:
        type: string
        title: Selection rule
        description: Supported baseline value.
        const: greedy-lowest-id-tie
        default: greedy-lowest-id-tie
      stopping:
        type: string
        title: Stopping rule
        description: Supported baseline value.
        const: turn-end-or-budget
        default: turn-end-or-budget
  InferenceRequest:
    type: object
    x-owner: InferenceRequest
    additionalProperties: false
    required:
    - text
    - generation
    properties:
      text:
        type: string
        title: Request input
        description: Exact user text; no normalization or truncation.
        default: the ball is in
      generation:
        $ref: '#/$defs/GenerationPolicy'
  RequestArrival:
    type: object
    x-owner: InferenceRequest
    additionalProperties: false
    required:
    - request_id
    - arrival_us
    - request
    properties:
      request_id:
        type: string
        title: Request identity
        description: Request identity
        pattern: ^[a-z][a-z0-9-]*$
      arrival_us:
        type: integer
        title: Declared virtual arrival in microseconds
        description: Declared virtual arrival in microseconds
        minimum: 0
        maximum: 9007199254740991
      request:
        $ref: '#/$defs/InferenceRequest'
  Workload:
    type: object
    x-owner: Workload
    additionalProperties: false
    required:
    - kind
    - requests
    properties:
      kind:
        type: string
        title: Arrival policy
        description: Arrival policy
        const: fixed-arrivals
        default: fixed-arrivals
      requests:
        type: array
        title: Ordered requests
        description: Ordered requests
        items:
          $ref: '#/$defs/RequestArrival'
        minItems: 1
  KVResidencySystemConfig:
    type: object
    x-owner: InferenceSystem
    additionalProperties: false
    required:
    - backend
    - device_kv_bytes
    - host_kv_bytes
    - max_active_requests
    - compute_flops_per_us
    - memory_bytes_per_us
    - link_bytes_per_us
    - link_latency_us
    - retention_policy
    - max_requests
    - max_new_tokens_cap
    properties:
      backend:
        type: string
        enum:
        - reference
        - cuda
        default: reference
        title: Numerical backend
      device_kv_bytes:
        type: integer
        minimum: 1
        maximum: 1048576
        default: 16384
        title: "Device KV budget \xB7 bytes"
      host_kv_bytes:
        type: integer
        minimum: 0
        maximum: 1048576
        default: 32768
        title: "Host KV budget \xB7 bytes"
      max_active_requests:
        type: integer
        minimum: 1
        maximum: 8
        default: 2
        title: Active request slots
      compute_flops_per_us:
        type: number
        minimum: 0.001
        default: 1000
        title: "Effective matmul FLOPs / virtual \xB5s"
      memory_bytes_per_us:
        type: number
        minimum: 0.001
        default: 1000
        title: "Logical memory bytes / virtual \xB5s"
      link_bytes_per_us:
        type: number
        minimum: 0.001
        default: 100
        title: "Transfer bytes / virtual \xB5s"
      link_latency_us:
        type: number
        minimum: 0
        default: 10
        title: "Transfer startup \xB7 virtual \xB5s"
      retention_policy:
        type: string
        const: whole-prefix-lru
        default: whole-prefix-lru
      max_requests:
        type: integer
        const: 8
        default: 8
      max_new_tokens_cap:
        type: integer
        const: 8
        default: 8
  TokenDelivered:
    type: object
    x-owner: InferenceResponse
    additionalProperties: false
    required:
    - kind
    - work_id
    - token_ids
    - output_start
    - display_delta
    properties:
      kind:
        type: string
        title: Event kind
        description: Event kind
        const: token-delivered
        default: token-delivered
      work_id:
        type: string
        title: Producing computation
        description: Producing computation
      token_ids:
        type: array
        title: Delivered token IDs
        description: Delivered token IDs
        items:
          type: integer
          title: Delivered token ID
          description: Delivered token ID
          minimum: 0
          maximum: 9007199254740991
        minItems: 1
      output_start:
        type: integer
        title: Client token offset
        description: Client token offset
        minimum: 0
        maximum: 9007199254740991
      display_delta:
        type: string
        title: Decoded text delivered to the client
        description: Diagnostic token display; raw IDs are authoritative. Control, byte, and hex IDs appear
          as labeled markers.
  RequestFinished:
    type: object
    x-owner: InferenceResponse
    additionalProperties: false
    required:
    - kind
    - outcome
    properties:
      kind:
        type: string
        title: Event kind
        description: Event kind
        const: request-finished
        default: request-finished
      outcome:
        $ref: '#/$defs/RunOutcome'
  RunOutcome:
    type: object
    x-owner: InferenceResponse
    additionalProperties: false
    required:
    - selected_tokens
    - delivered_tokens
    - unused_budget
    - stop_reason
    - complete
    properties:
      selected_tokens:
        type: integer
        title: Selected IDs
        description: Includes terminal controls.
        minimum: 1
      delivered_tokens:
        type: integer
        title: Delivered IDs
        description: Every selected ID except TURN_END, including diagnostic control/byte/hex tokens.
        minimum: 0
      unused_budget:
        type: integer
        title: Unused allowance
        description: Requested ceiling minus actual selected ID count.
        minimum: 0
      stop_reason:
        type: string
        title: Termination condition
        description: Recorded by the execution loop.
        enum:
        - turn_end
        - output_budget
      complete:
        type: boolean
        title: Turn complete
        description: True only if TURN_END was selected.
  DecodingContract:
    type: object
    properties:
      choice:
        type: string
      explanation:
        type: string
      rule:
        type: string
    required:
    - choice
    - explanation
    - rule
    additionalProperties: false
    x-owner: GenerationPolicy
