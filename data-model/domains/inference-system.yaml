$defs:
  InferenceSystem:
    type: object
    x-owner: InferenceSystem
    additionalProperties: false
    required:
    - max_new_tokens_cap
    - max_requests
    - dispatch
    - model_execution
    properties:
      max_new_tokens_cap:
        type: integer
        title: Supported new-token limit
        description: Supported baseline value.
        const: 16
        default: 16
      max_requests:
        type: integer
        title: Supported request count
        description: Supported request count
        minimum: 0
        maximum: 9007199254740991
        const: 1
        default: 1
      dispatch:
        type: string
        title: Direct dispatch
        description: One in-process execution endpoint; no router, queue, network or placement simulation.
        const: direct-in-process
        default: direct-in-process
      model_execution:
        $ref: '#/$defs/FullPrefixExecutionConfig'
  GenerationPolicy:
    type: object
    x-owner: GenerationPolicy
    additionalProperties: false
    required:
    - max_new_tokens
    - selection
    - stopping
    properties:
      max_new_tokens:
        type: integer
        title: Maximum new tokens
        description: Maximum number of selected IDs, including an end token. May stop earlier.
        minimum: 1
        default: 11
        x-maximum-from: system.max_new_tokens_cap
        maximum: 128
      selection:
        type: string
        title: Selection rule
        description: Supported baseline value.
        const: greedy-lowest-id-tie
        default: greedy-lowest-id-tie
      stopping:
        type: string
        title: Stopping rule
        description: Stop at the configured model end token or output budget; context capacity also bounds
          execution.
        default: turn-end-or-budget
        enum:
        - turn-end-or-budget
        - model-end-or-budget
  InferenceRequest:
    type: object
    x-owner: InferenceRequest
    additionalProperties: false
    required:
    - text
    - generation
    properties:
      text:
        type: string
        title: Request input
        description: User text; normalization is declared by the selected tokenizer.
        default: ann has the cup. ben has the book. who has the cup?
      generation:
        $ref: '#/$defs/GenerationPolicy'
  RequestArrival:
    type: object
    x-owner: InferenceRequest
    additionalProperties: false
    required:
    - request_id
    - arrival_us
    - request
    properties:
      request_id:
        type: string
        title: Request identity
        description: Request identity
        pattern: ^[a-z][a-z0-9-]*$
      arrival_us:
        type: integer
        title: Declared virtual arrival in microseconds
        description: Declared virtual arrival in microseconds
        minimum: 0
        maximum: 9007199254740991
      request:
        $ref: '#/$defs/InferenceRequest'
  Workload:
    type: object
    x-owner: Workload
    additionalProperties: false
    required:
    - kind
    - requests
    properties:
      kind:
        type: string
        title: Arrival policy
        description: Arrival policy
        const: fixed-arrivals
        default: fixed-arrivals
      requests:
        type: array
        title: Ordered requests
        description: Ordered requests
        items:
          $ref: '#/$defs/RequestArrival'
        minItems: 1
  KVResidencySystemConfig:
    type: object
    x-owner: InferenceSystem
    additionalProperties: false
    required:
    - max_requests
    - max_new_tokens_cap
    - model_execution
    - scheduling
    - kv_cache
    - transfer
    - compute_service
    properties:
      max_requests:
        type: integer
        const: 8
        default: 8
      max_new_tokens_cap:
        type: integer
        const: 16
        default: 16
      model_execution:
        $ref: '#/$defs/CachedExecutionConfig'
      scheduling:
        $ref: '#/$defs/RequestSchedulingConfig'
      kv_cache:
        $ref: '#/$defs/KVCacheConfig'
      transfer:
        $ref: '#/$defs/StateTransferConfig'
      compute_service:
        $ref: '#/$defs/ComputeServiceConfig'
  TokenPublished:
    type: object
    x-owner: InferenceResponse
    additionalProperties: false
    required:
    - kind
    - work_id
    - token_ids
    - output_start
    - display_delta
    properties:
      kind:
        type: string
        title: Event kind
        description: Event kind
        const: token-published
        default: token-published
      work_id:
        type: string
        title: Producing computation
        description: Producing computation
      token_ids:
        type: array
        title: Published token IDs
        description: Published token IDs
        items:
          type: integer
          title: Published token ID
          description: Published token ID
          minimum: 0
          maximum: 9007199254740991
        minItems: 1
      output_start:
        type: integer
        title: Published output token offset
        description: Published output token offset
        minimum: 0
        maximum: 9007199254740991
      display_delta:
        type: string
        title: Diagnostic text published to the output collector
        description: Diagnostic token display; raw IDs are authoritative. Control, byte, and hex IDs appear
          as labeled markers.
  RequestFinished:
    type: object
    x-owner: InferenceResponse
    additionalProperties: false
    required:
    - kind
    - outcome
    properties:
      kind:
        type: string
        title: Event kind
        description: Event kind
        const: request-finished
        default: request-finished
      outcome:
        $ref: '#/$defs/RunOutcome'
  RunOutcome:
    type: object
    x-owner: InferenceResponse
    additionalProperties: false
    required:
    - selected_tokens
    - published_tokens
    - unused_budget
    - stop_reason
    - complete
    properties:
      selected_tokens:
        type: integer
        title: Selected IDs
        description: Includes terminal controls.
        minimum: 1
      published_tokens:
        type: integer
        title: Published IDs
        description: Every selected ID except TURN_END, including diagnostic control/byte/hex tokens.
        minimum: 0
      unused_budget:
        type: integer
        title: Unused allowance
        description: Requested ceiling minus actual selected ID count.
        minimum: 0
      stop_reason:
        type: string
        title: Termination condition
        description: Recorded by the execution loop.
        enum:
        - turn_end
        - output_budget
      complete:
        type: boolean
        title: Turn complete
        description: True only if TURN_END was selected.
  DecodingContract:
    type: object
    properties:
      choice:
        type: string
      explanation:
        type: string
      rule:
        type: string
    required:
    - choice
    - explanation
    - rule
    additionalProperties: false
    x-owner: GenerationPolicy
  SystemConfigurationPreview:
    type: object
    x-owner: InferenceSystem
    title: Inference system
    description: Expandable mechanism configuration preview; independent of the executed system binding.
    additionalProperties: false
    required:
    - attention
    properties:
      attention:
        $ref: '#/$defs/AttentionConfiguration'
  WorkloadTransformationPreview:
    type: object
    x-owner: Workload
    title: Input transformations
    description: Rules over the data-plane source input. Nonzero choices preview an intended workload
      transformation; the baseline does not generate variants, random messages, or timed arrivals.
    additionalProperties: false
    required:
    - suffix_variants
    - random_messages
    - arrival_spacing_us
    properties:
      suffix_variants:
        type: integer
        title: Suffix variants
        minimum: 0
        maximum: 9007199254740991
        default: 0
      random_messages:
        type: integer
        title: Random messages
        minimum: 0
        maximum: 9007199254740991
        default: 0
      arrival_spacing_us:
        type: integer
        title: "Arrival spacing (\xB5s)"
        minimum: 0
        maximum: 9007199254740991
        default: 0
  TokenStepRequest:
    type: object
    x-owner: InferenceRequest
    additionalProperties: false
    required:
    - checkpoint_sha256
    - prefix_ids
    - output_ids
    - generation
    - ontology_binding
    properties:
      checkpoint_sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
      prefix_ids:
        type: array
        items:
          type: integer
          minimum: 0
          maximum: 383
        minItems: 1
      output_ids:
        type: array
        items:
          type: integer
          minimum: 0
          maximum: 383
      generation:
        $ref: '#/$defs/GenerationPolicy'
      ontology_binding:
        $ref: '#/$defs/OntologyBinding'
    description: 'One next-token invocation: exact raw prefix and supplied continuation, without chat
      framing. Generation budget counts the continuation, not the prefix.'
