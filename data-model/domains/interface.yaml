$defs:
  InspectionState:
    type: object
    x-owner: InspectionState
    additionalProperties: false
    required:
    - run_id
    - position
    - observation_id
    - surface
    - architecture_step
    - computation_index
    properties:
      run_id:
        type:
        - string
        - 'null'
        title: Observed run
        description: Current accepted computation identity; null before the first step or after reset.
        pattern: ^[0-9a-f]{64}$
      position:
        type: integer
        title: Sequence position
        description: Single selected position in the accepted sequence; determines the exact prefix for
          Next Token. The recorded computation is derived from this position.
        minimum: 0
      observation_id:
        type:
        - string
        - 'null'
        title: Executed observation
        description: Exact observation ID within the selected pass, or null for request and output inspection.
        default: null
      surface:
        type: string
        title: Inspection surface
        description: Single detail and diagram focus; model requires an observation in the selected computation.
        enum:
        - request
        - workload
        - client
        - system
        - model
        - selection
        - response
        - architecture
        default: request
      architecture_step:
        type:
        - integer
        - 'null'
        minimum: 0
        description: Index in the selected architecture walkthrough; never an observation ID.
        default: null
      computation_index:
        type:
        - integer
        - 'null'
        minimum: 0
        default: null
        description: Selected computation in a resource execution; null for ordinary token generation.
    allOf:
    - if:
        properties:
          surface:
            const: model
      then:
        properties:
          observation_id:
            type: string
    - if:
        not:
          properties:
            surface:
              const: model
      then:
        properties:
          observation_id:
            type: 'null'
    - if:
        properties:
          surface:
            const: architecture
      then:
        required:
        - architecture_step
        properties:
          architecture_step:
            type: integer
    - if:
        not:
          properties:
            surface:
              const: architecture
      then:
        properties:
          architecture_step:
            type: 'null'
  ApiError:
    type: object
    x-owner: ApiError
    additionalProperties: false
    required:
    - error
    properties:
      error:
        type: string
        title: Explicit rejection reason
        description: Explicit rejection reason
