$defs:
  InspectionState:
    type: object
    x-owner: InspectionState
    additionalProperties: false
    required:
    - run_id
    - position
    - observation_id
    - surface
    - architecture_step
    properties:
      run_id:
        type:
        - string
        - 'null'
        title: Observed run
        description: Current accepted computation identity; null before the first step or after reset.
        pattern: ^[0-9a-f]{64}$
      position:
        type: integer
        title: Sequence position
        description: Single selected position in the accepted sequence; determines the exact prefix for
          Next Token. The recorded computation is derived from this position.
        minimum: 0
      observation_id:
        type:
        - string
        - 'null'
        title: Executed observation
        description: Exact observation ID within the selected pass, or null for request and output inspection.
        default: null
      surface:
        type: string
        title: Inspection surface
        description: Single detail and diagram focus; model requires an observation in the selected computation.
        enum:
        - request
        - workload
        - client
        - system
        - model
        - selection
        - response
        - architecture
        default: request
      architecture_step:
        type:
        - integer
        - 'null'
        minimum: 0
        description: Index in the selected architecture walkthrough; never an observation ID.
        default: null
    allOf:
    - if:
        properties:
          surface:
            const: model
      then:
        properties:
          observation_id:
            type: string
    - if:
        not:
          properties:
            surface:
              const: model
      then:
        properties:
          observation_id:
            type: 'null'
    - if:
        properties:
          surface:
            const: architecture
      then:
        required:
        - architecture_step
        properties:
          architecture_step:
            type: integer
    - if:
        not:
          properties:
            surface:
              const: architecture
      then:
        properties:
          architecture_step:
            type: 'null'
  Capabilities:
    type: object
    x-owner: ExecutionCapabilities
    additionalProperties: false
    required:
    - engine
    - contract_sha256
    properties:
      engine:
        type: string
        title: Engine version
        description: Engine version
        const: workload-engine-v1
        default: workload-engine-v1
      contract_sha256:
        type: string
        title: Contract identity
        description: Contract identity
        pattern: ^[0-9a-f]{64}$
  ApiError:
    type: object
    x-owner: ApiError
    additionalProperties: false
    required:
    - error
    properties:
      error:
        type: string
        title: Explicit rejection reason
        description: Explicit rejection reason
  CacheCapabilities:
    type: object
    x-owner: ExecutionCapabilities
    additionalProperties: false
    required:
    - contract_sha256
    - backends
    properties:
      contract_sha256:
        type: string
      backends:
        type: array
        items:
          type: string
          enum:
          - reference
        minItems: 1
        uniqueItems: true
