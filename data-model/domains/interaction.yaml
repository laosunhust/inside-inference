$defs:
  CustomerSubmission:
    type: object
    x-owner: CustomerInteraction
    additionalProperties: false
    required:
    - kind
    - at_us
    - request_id
    - request
    properties:
      kind:
        type: string
        const: submit
      at_us:
        type: number
        minimum: 0
      request_id:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
      request:
        $ref: '#/$defs/InferenceRequest'
  CustomerConsumption:
    type: object
    x-owner: CustomerInteraction
    additionalProperties: false
    required:
    - kind
    - at_us
    - request_id
    - output_bytes
    properties:
      kind:
        type: string
        const: consume
      at_us:
        type: number
        minimum: 0
      request_id:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
      output_bytes:
        type: integer
        minimum: 0
        description: Cumulative application-output bytes consumed; excludes protocol framing. A declared
          action, not proof that bytes were available.
  CustomerCancellation:
    type: object
    x-owner: CustomerInteraction
    additionalProperties: false
    required:
    - kind
    - at_us
    - request_id
    properties:
      kind:
        type: string
        const: cancel
      at_us:
        type: number
        minimum: 0
      request_id:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
  CustomerInteraction:
    type: object
    x-owner: CustomerInteraction
    additionalProperties: false
    required:
    - clock
    - actions
    properties:
      clock:
        type: string
        const: scenario-virtual-us
      actions:
        type: array
        minItems: 1
        items:
          oneOf:
          - $ref: '#/$defs/CustomerSubmission'
          - $ref: '#/$defs/CustomerConsumption'
          - $ref: '#/$defs/CustomerCancellation'
  ClientConfigurationPreview:
    type: object
    x-owner: CustomerInteraction
    title: Client
    description: Client configuration preview. Paused marks the receiving boundary; no network, buffer,
      or backpressure execution is implied.
    additionalProperties: false
    required:
    - consumption
    properties:
      consumption:
        type: string
        title: Consumption
        default: reading
        oneOf:
        - type: string
          const: reading
          title: Reading
        - type: string
          const: paused
          title: Paused
