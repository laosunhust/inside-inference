$defs:
  CustomerSubmission:
    type: object
    x-owner: CustomerInteraction
    additionalProperties: false
    required:
    - kind
    - at_us
    - request_id
    - request
    properties:
      kind:
        type: string
        const: submit
      at_us:
        type: number
        minimum: 0
      request_id:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
      request:
        $ref: '#/$defs/InferenceRequest'
  CustomerConsumption:
    type: object
    x-owner: CustomerInteraction
    additionalProperties: false
    required:
    - kind
    - at_us
    - request_id
    - output_bytes
    properties:
      kind:
        type: string
        const: consume
      at_us:
        type: number
        minimum: 0
      request_id:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
      output_bytes:
        type: integer
        minimum: 0
        description: Cumulative application-output bytes consumed; excludes protocol framing. A declared
          action, not proof that bytes were available.
  CustomerCancellation:
    type: object
    x-owner: CustomerInteraction
    additionalProperties: false
    required:
    - kind
    - at_us
    - request_id
    properties:
      kind:
        type: string
        const: cancel
      at_us:
        type: number
        minimum: 0
      request_id:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
  CustomerInteraction:
    type: object
    x-owner: CustomerInteraction
    additionalProperties: false
    required:
    - clock
    - actions
    properties:
      clock:
        type: string
        const: scenario-virtual-us
      actions:
        type: array
        minItems: 1
        items:
          oneOf:
          - $ref: '#/$defs/CustomerSubmission'
          - $ref: '#/$defs/CustomerConsumption'
          - $ref: '#/$defs/CustomerCancellation'
  GenerationAdvance:
    type: object
    x-owner: InferenceRequest
    additionalProperties: false
    required: [session_id, prefix_ids, output_ids]
    properties:
      session_id:
        type: string
        pattern: ^[a-f0-9]{32}$
        description: Session returned by prepareGeneration; immutable execution and generation policy are retained by the worker, never supplied again per token.
      prefix_ids:
        type: array
        minItems: 1
        maxItems: 512
        items:
          type: integer
          minimum: 0
      output_ids:
        type: array
        maxItems: 128
        items:
          type: integer
          minimum: 0
