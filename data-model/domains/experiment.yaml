$defs:
  TensorObservation:
    type: object
    properties:
      axes:
        type: array
        items:
          type: string
      dtype:
        type: string
      id:
        type: string
      inputs:
        type: array
        items:
          type: string
      layer:
        type:
        - integer
        - 'null'
      positions:
        type: array
        items:
          type: integer
      request_id:
        type: string
      run_id:
        type: string
      shape:
        type: array
        items:
          type: integer
      step:
        type: integer
      values:
        type: array
        items:
          anyOf:
          - type: number
          - type: boolean
          - type: array
            items:
              type:
              - number
              - boolean
      operation:
        anyOf:
        - $ref: '#/$defs/EmbeddingOperation'
        - $ref: '#/$defs/PositionEncodingOperation'
        - $ref: '#/$defs/NormalizationOperation'
        - $ref: '#/$defs/AttentionOperation'
        - $ref: '#/$defs/ResidualAdditionOperation'
        - $ref: '#/$defs/FeedForwardOperation'
        - $ref: '#/$defs/OutputProjectionOperation'
        - $ref: '#/$defs/TokenizerOperation'
        - $ref: '#/$defs/KVStateOperation'
    required:
    - axes
    - dtype
    - id
    - inputs
    - layer
    - positions
    - request_id
    - run_id
    - shape
    - step
    - values
    - operation
    additionalProperties: false
    x-owner: ExperimentObservation
  KVExperimentInput:
    type: object
    x-owner: InferenceRequest
    additionalProperties: false
    required:
    - system
    - workload
    - ontology_binding
    properties:
      system:
        $ref: '#/$defs/KVResidencySystemConfig'
      workload:
        $ref: '#/$defs/Workload'
      ontology_binding:
        $ref: '#/$defs/OntologyBinding'
  CacheEvent:
    type: object
    x-owner: ExperimentEvent
    additionalProperties: false
    required:
    - event_id
    - request_id
    - time_us
    - kind
    - state_id
    - bytes
    - device_reserved_bytes
    - host_retained_bytes
    - detail
    - causes
    - phase
    - transfer_direction
    properties:
      event_id:
        type: string
      request_id:
        type: string
      time_us:
        type: number
        minimum: 0
      kind:
        type: string
        enum:
        - arrived
        - queued
        - admitted
        - local-hit
        - remote-hit
        - miss
        - evicted
        - transfer-start
        - transfer-end
        - compute-start
        - compute-end
        - selected
        - finished
        - retained
        - retention-start
      state_id:
        type:
        - string
        - 'null'
      bytes:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      device_reserved_bytes:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      host_retained_bytes:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      detail:
        type: string
      causes:
        type: array
        items:
          type: string
      phase:
        type:
        - string
        - 'null'
        enum:
        - null
        - prefill
        - decode
        - cache-build
      transfer_direction:
        type:
        - string
        - 'null'
        enum:
        - null
        - host-to-device
        - device-to-host
    allOf:
    - if:
        properties:
          kind:
            enum:
            - compute-start
            - compute-end
      then:
        properties:
          phase:
            not:
              type: 'null'
    - if:
        not:
          properties:
            kind:
              enum:
              - compute-start
              - compute-end
      then:
        properties:
          phase:
            type: 'null'
    - if:
        properties:
          kind:
            enum:
            - transfer-start
            - transfer-end
      then:
        properties:
          transfer_direction:
            not:
              type: 'null'
    - if:
        not:
          properties:
            kind:
              enum:
              - transfer-start
              - transfer-end
      then:
        properties:
          transfer_direction:
            type: 'null'
  CacheMeasurement:
    type: object
    x-owner: ExperimentObservation
    additionalProperties: false
    required:
    - event_id
    - kind
    - elapsed_us
    - bytes
    properties:
      event_id:
        type: string
      kind:
        type: string
        enum:
        - compute
        - host-to-device
        - device-to-host
        - device-copy
        - reference-check
      elapsed_us:
        type: number
        minimum: 0
      bytes:
        type: integer
        minimum: 0
        maximum: 9007199254740991
  CacheRun:
    type: object
    x-owner: ExperimentExecution
    additionalProperties: false
    required:
    - id
    - declaration
    - checkpoint
    - provenance
    - events
    - computations
    - measurements
    - outcomes
    - states
    - evidence
    properties:
      id:
        type: string
      declaration:
        $ref: '#/$defs/KVRunBinding'
      checkpoint:
        $ref: '#/$defs/ModelArtifact'
      provenance:
        $ref: '#/$defs/ExecutionProvenance'
      events:
        type: array
        items:
          $ref: '#/$defs/CacheEvent'
      computations:
        type: array
        items:
          $ref: '#/$defs/CacheComputation'
      measurements:
        type: array
        items:
          $ref: '#/$defs/CacheMeasurement'
      outcomes:
        type: object
        additionalProperties:
          $ref: '#/$defs/RunOutcome'
      states:
        type: object
        additionalProperties:
          $ref: '#/$defs/KVState'
      evidence:
        type: string
  ExecutionProvenance:
    type: object
    properties:
      python:
        type: string
      revision:
        type: string
      source_sha256:
        type: string
      sources:
        type: object
        additionalProperties:
          type: string
          pattern: ^[0-9a-f]{64}$
      backend:
        $ref: '#/$defs/ExecutionBackend'
    required:
    - python
    - revision
    - source_sha256
    - sources
    - backend
    additionalProperties: false
    x-owner: ExperimentExecution
  KVRunBinding:
    type: object
    x-owner: ExperimentExecution
    additionalProperties: false
    required:
    - model
    - system
    - workload
    - ontology_binding
    properties:
      model:
        $ref: '#/$defs/ModelArtifactReference'
      system:
        $ref: '#/$defs/KVResidencySystemConfig'
      workload:
        $ref: '#/$defs/Workload'
      ontology_binding:
        $ref: '#/$defs/OntologyBinding'
  OntologyBinding:
    type: object
    x-owner: ExecutionSpec
    x-ontology-binding: true
    additionalProperties: false
    required:
    - primary
    - related
    properties:
      primary:
        type: string
        description: Primary subject; must name an admitted ontology concept.
        x-ontology-reference: true
      related:
        type: array
        uniqueItems: true
        description: Other associated concepts; excludes the primary subject.
        items:
          type: string
          x-ontology-reference: true
  ExecutionReplayInput:
    type: object
    x-owner: ExperimentExecution
    additionalProperties: false
    required:
    - record_json
    properties:
      record_json:
        type: string
        title: Exported evidence
        description: Exact exported JSON bytes; preserve numeric lexemes for replay.
  ExperimentCatalog:
    type: object
    x-owner: ExperimentDesign
    additionalProperties: false
    required:
    - experiments
    properties:
      experiments:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/ExperimentDesign'
  ExperimentDesign:
    type: object
    x-owner: ExperimentDesign
    additionalProperties: false
    required:
    - id
    - name
    - question
    - ontology_binding
    - variants
    - missing_controls
    - contract
    - sources
    - evidence
    allOf:
    - if:
        properties:
          missing_controls:
            type: array
            maxItems: 0
      then:
        properties:
          variants:
            type: array
            minItems: 1
    - if:
        properties:
          missing_controls:
            type: array
            minItems: 1
      then:
        properties:
          variants:
            type: array
            maxItems: 0
    properties:
      id:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
      name:
        type: string
        pattern: '[\s\S]+'
      question:
        type: string
        pattern: '[\s\S]+'
      ontology_binding:
        $ref: '#/$defs/OntologyBinding'
      variants:
        type: array
        items:
          $ref: '#/$defs/ExperimentSpec'
        description: Complete selectable inputs; selecting a variant configures workload and execution without generating
          output.
      missing_controls:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        description: Undeclared controls the question needs; any entry makes the experiment planned, not executable.
      contract:
        $ref: '#/$defs/AbstractionContract'
      sources:
        type: array
        items:
          $ref: '#/$defs/ExperimentSource'
      evidence:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._/-]*$
        description: Repository paths of evaluation results or research records supporting current conclusions.
  AbstractionContract:
    type: object
    x-owner: ExperimentDesign
    additionalProperties: false
    required:
    - target_regime
    - preserved
    - omissions
    - evidence_plan
    - limits
    properties:
      target_regime:
        type: string
        title: Target regime
        pattern: '[\s\S]+'
      preserved:
        type: string
        title: Preserved
        pattern: '[\s\S]+'
      omissions:
        type: string
        title: Omitted
        pattern: '[\s\S]+'
      evidence_plan:
        type: string
        title: Evidence plan
        pattern: '[\s\S]+'
      limits:
        type: string
        title: Limits
        pattern: '[\s\S]+'
  ExperimentSource:
    type: object
    x-owner: ExperimentDesign
    additionalProperties: false
    required:
    - title
    - url
    properties:
      title:
        type: string
        pattern: '[\s\S]+'
      url:
        type: string
        pattern: ^https://
  BrowserTokenTiming:
    type: object
    x-owner: ExperimentObservation
    additionalProperties: false
    required:
    - prediction_id
    - token_index
    - segment
    - mode
    - started_ms
    - dispatched_ms
    - updated_ms
    - publishes_text
    - context_length
    - selected_id
    - stop_reason
    - work
    - decoder_ms
    - service_ms
    - speculation
    properties:
      prediction_id:
        type: string
        pattern: ^[0-9a-f]{64}$
      token_index:
        type: integer
        minimum: 1
        description: One-based generated token index in the accepted output, including terminal tokens.
      segment:
        type: integer
        minimum: 1
        description: One Generate or Next Token gesture; intervals never cross this boundary.
      mode:
        type: string
        enum:
        - continuous
        - manual
      started_ms:
        type: number
        minimum: 0
        description: performance.now at the start of the generation gesture, after prior model loading and input
          preparation.
      dispatched_ms:
        type: number
        minimum: 0
        description: Browser performance.now immediately before dispatch after earlier operations settle; dispatch
          minus gesture start includes pre-dispatch work, not exclusively worker queue time.
      updated_ms:
        type: number
        minimum: 0
        description: performance.now after the accepted token updates the output DOM; not a physical paint timestamp.
      publishes_text:
        type: boolean
        description: This token changed visible decoded output; an end-token-only response does not establish TTFT.
      context_length:
        type: integer
        minimum: 1
      selected_id:
        type: integer
        minimum: 0
      stop_reason:
        type:
        - string
        - 'null'
        enum:
        - null
        - end_token
        - output_budget
        - context_capacity
      work:
        $ref: '#/$defs/GenerationWork'
      decoder_ms:
        type: number
        minimum: 0
        description: Copied GenerationPrediction.decoder_ms, including any round work charged to this delivery. Independent clock domain from browser timestamps.
      service_ms:
        type: number
        minimum: 0
        description: Copied worker response-construction duration including decoder; excludes admission and JSON
          serialization. Cross-domain timestamp arithmetic is undefined.
      speculation:
        oneOf:
        - $ref: '#/$defs/SpeculativeDelivery'
        - type: 'null'
  BrowserGenerationTiming:
    type: object
    x-owner: ExperimentObservation
    additionalProperties: false
    required:
    - clock
    - samples
    - observers
    properties:
      clock:
        type: string
        const: browser-monotonic-ms
      samples:
        type: array
        items:
          $ref: '#/$defs/BrowserTokenTiming'
      observers:
        type: array
        description: Completed synchronous inspection/chart update batches. An uncovered sample has no observer
          measurement yet or its update was skipped; absence never means zero cost. Browser clock only.
        items:
          $ref: '#/$defs/BrowserObserverBatch'
  BrowserObserverBatch:
    type: object
    x-owner: ExperimentObservation
    additionalProperties: false
    required:
    - first_token
    - last_token
    - started_ms
    - finished_ms
    properties:
      first_token:
        type: integer
        minimum: 1
      last_token:
        type: integer
        minimum: 1
      started_ms:
        type: number
        minimum: 0
        description: Browser performance.now before synchronous inspection and performance rendering; excludes deferred
          layout and paint.
      finished_ms:
        type: number
        minimum: 0
        description: Browser performance.now after rendering. Minus started_ms is synchronous update duration; minus
          token publication is completion lag including scheduling, not total observer overhead.
  ExperimentSpec:
    type: object
    x-owner: ExperimentSpec
    additionalProperties: false
    required:
    - label
    - input
    properties:
      label:
        type: string
        pattern: '[\s\S]+'
      input:
        $ref: '#/$defs/GenerationInput'
  SpeculationRound:
    type: object
    x-owner: Decoding
    additionalProperties: false
    required:
    - id
    - draft_model_id
    - draft_weights_sha256
    - proposed_ids
    - target_selected_ids
    - accepted_count
    - committed_ids
    - draft_calls
    - target_calls
    - draft_work
    - target_work
    - draft_ms
    - target_ms
    properties:
      id:
        type: string
        pattern: ^[0-9a-f]{64}$
      draft_model_id:
        type: string
      draft_weights_sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
      proposed_ids:
        type: array
        items:
          type: integer
          minimum: 0
      target_selected_ids:
        type: array
        items:
          type: integer
          minimum: 0
      accepted_count:
        type: integer
        minimum: 0
      committed_ids:
        type: array
        items:
          type: integer
          minimum: 0
      draft_calls:
        type: integer
        minimum: 0
      target_calls:
        type: integer
        const: 1
      draft_work:
        $ref: '#/$defs/GenerationWork'
      target_work:
        $ref: '#/$defs/GenerationWork'
      draft_ms:
        type: number
        minimum: 0
      target_ms:
        type: number
        minimum: 0
  SpeculativeDelivery:
    type: object
    x-owner: Decoding
    additionalProperties: false
    required:
    - round_id
    - token_offset
    - buffered
    - round
    properties:
      round_id:
        type: string
        pattern: ^[0-9a-f]{64}$
      token_offset:
        type: integer
        minimum: 0
      buffered:
        type: boolean
      round:
        oneOf:
        - $ref: '#/$defs/SpeculationRound'
        - type: 'null'
