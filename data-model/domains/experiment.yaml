$defs:
  RequestBinding:
    type: object
    x-owner: ExperimentSpec
    additionalProperties: false
    required:
    - model
    - system
    - request
    - ontology_binding
    properties:
      model:
        $ref: '#/$defs/ModelArtifactReference'
      system:
        $ref: '#/$defs/InferenceSystem'
      request:
        $ref: '#/$defs/InferenceRequest'
      ontology_binding:
        $ref: '#/$defs/OntologyBinding'
  RunBinding:
    type: object
    x-owner: ExperimentSpec
    additionalProperties: false
    required:
    - model
    - system
    - workload
    - ontology_binding
    properties:
      model:
        $ref: '#/$defs/ModelArtifactReference'
      system:
        $ref: '#/$defs/InferenceSystem'
      workload:
        $ref: '#/$defs/Workload'
      ontology_binding:
        $ref: '#/$defs/OntologyBinding'
  EventClock:
    type: object
    x-owner: ExperimentEvent
    additionalProperties: false
    required:
    - kind
    properties:
      kind:
        type: string
        title: Clock domain
        description: Clock domain
        const: execution-order
        default: execution-order
  RequestArrived:
    type: object
    x-owner: ExperimentEvent
    additionalProperties: false
    required:
    - kind
    - arrival_us
    properties:
      kind:
        type: string
        title: Event kind
        description: Event kind
        const: request-arrived
        default: request-arrived
      arrival_us:
        type: integer
        title: Declared virtual arrival; not service latency
        description: Declared virtual arrival; not service latency
        minimum: 0
        maximum: 9007199254740991
  InputEncoded:
    type: object
    x-owner: ExperimentEvent
    additionalProperties: false
    required:
    - kind
    - input_sha256
    - token_count
    properties:
      kind:
        type: string
        title: Event kind
        description: Event kind
        const: input-encoded
        default: input-encoded
      input_sha256:
        type: string
        title: Framed input identity
        description: Framed input identity
        pattern: ^[0-9a-f]{64}$
      token_count:
        type: integer
        title: Encoded positions
        description: Encoded positions
        minimum: 0
        maximum: 9007199254740991
  RunEvent:
    type: object
    x-owner: ExperimentEvent
    additionalProperties: false
    required:
    - event_id
    - run_id
    - request_id
    - sequence
    - causes
    - payload
    properties:
      event_id:
        type: string
        title: Event identity
        description: Event identity
      run_id:
        type: string
        title: Run identity
        description: Run identity
        pattern: ^[0-9a-f]{64}$
      request_id:
        type: string
        title: Request identity
        description: Request identity
      sequence:
        type: integer
        title: Global sequence order
        description: Global sequence order
        minimum: 0
        maximum: 9007199254740991
      causes:
        type: array
        title: Earlier event identities
        description: Earlier event identities
        items:
          type: string
          title: Causal predecessor
          description: Causal predecessor
        uniqueItems: true
      payload:
        oneOf:
        - $ref: '#/$defs/RequestArrived'
        - $ref: '#/$defs/InputEncoded'
        - $ref: '#/$defs/ModelForwardCompleted'
        - $ref: '#/$defs/TokenSelected'
        - $ref: '#/$defs/TokenPublished'
        - $ref: '#/$defs/RequestFinished'
  NumericalTrace:
    type: object
    properties:
      checkpoint:
        $ref: '#/$defs/ModelArtifact'
      provenance:
        $ref: '#/$defs/ExecutionProvenance'
      contract_sha256:
        type: string
      declaration:
        $ref: '#/$defs/RequestBinding'
      decoding_contract:
        $ref: '#/$defs/DecodingContract'
      evidence:
        type: string
      format:
        type: string
        const: naive-gpt-run-v2
      id:
        type: string
      outcome:
        $ref: '#/$defs/RunOutcome'
      output_ids:
        type: array
        items:
          type: integer
      output_display:
        type: string
        description: Diagnostic token display; raw IDs are authoritative. Control, byte, and hex IDs appear
          as labeled markers.
      passes:
        type: array
        items:
          $ref: '#/$defs/NumericalPass'
      precision:
        $ref: '#/$defs/NumericalPrecision'
      request_id:
        type: string
      sequence_ids:
        type: array
        items:
          type: integer
      tokenizer:
        $ref: '#/$defs/Encoding'
      vocabulary:
        type: array
        items:
          $ref: '#/$defs/Token'
    required:
    - checkpoint
    - provenance
    - contract_sha256
    - declaration
    - decoding_contract
    - evidence
    - format
    - id
    - outcome
    - output_ids
    - output_display
    - passes
    - precision
    - request_id
    - sequence_ids
    - tokenizer
    - vocabulary
    additionalProperties: false
    x-owner: ExperimentExecution
  RunRecord:
    type: object
    x-owner: ExperimentExecution
    additionalProperties: false
    required:
    - format
    - id
    - contract_sha256
    - declaration
    - clock
    - events
    - traces
    properties:
      format:
        type: string
        title: Run format
        description: Run format
        const: workload-run-v1
        default: workload-run-v1
      id:
        type: string
        title: Run identity
        description: Run identity
        pattern: ^[0-9a-f]{64}$
      contract_sha256:
        type: string
        title: Contract identity
        description: Contract identity
        pattern: ^[0-9a-f]{64}$
      declaration:
        $ref: '#/$defs/RunBinding'
      clock:
        $ref: '#/$defs/EventClock'
      events:
        type: array
        title: Ordered execution events
        description: Ordered execution events
        items:
          $ref: '#/$defs/RunEvent'
        minItems: 1
      traces:
        type: array
        title: Request computation evidence
        description: Request computation evidence
        items:
          $ref: '#/$defs/NumericalTrace'
        minItems: 1
  TensorObservation:
    type: object
    properties:
      axes:
        type: array
        items:
          type: string
      dtype:
        type: string
      formula:
        type: string
      id:
        type: string
      inputs:
        type: array
        items:
          type: string
      layer:
        type:
        - integer
        - 'null'
      positions:
        type: array
        items:
          type: integer
      request_id:
        type: string
      run_id:
        type: string
      shape:
        type: array
        items:
          type: integer
      step:
        type: integer
      values:
        type: array
        items:
          anyOf:
          - type: number
          - type: boolean
          - type: array
            items:
              type:
              - number
              - boolean
      operation:
        anyOf:
        - $ref: '#/$defs/EmbeddingOperation'
        - $ref: '#/$defs/PositionEncodingOperation'
        - $ref: '#/$defs/NormalizationOperation'
        - $ref: '#/$defs/AttentionOperation'
        - $ref: '#/$defs/ResidualAdditionOperation'
        - $ref: '#/$defs/FeedForwardOperation'
        - $ref: '#/$defs/OutputProjectionOperation'
        - $ref: '#/$defs/TokenizerOperation'
        - $ref: '#/$defs/KVStateOperation'
    required:
    - axes
    - dtype
    - formula
    - id
    - inputs
    - layer
    - positions
    - request_id
    - run_id
    - shape
    - step
    - values
    - operation
    additionalProperties: false
    x-owner: ExperimentObservation
  KVExperimentInput:
    type: object
    x-owner: ExperimentSpec
    additionalProperties: false
    required:
    - system
    - workload
    - ontology_binding
    properties:
      system:
        $ref: '#/$defs/KVResidencySystemConfig'
      workload:
        $ref: '#/$defs/Workload'
      ontology_binding:
        $ref: '#/$defs/OntologyBinding'
  CacheEvent:
    type: object
    x-owner: ExperimentEvent
    additionalProperties: false
    required:
    - event_id
    - request_id
    - time_us
    - kind
    - state_id
    - bytes
    - device_reserved_bytes
    - host_retained_bytes
    - detail
    - causes
    - phase
    - transfer_direction
    properties:
      event_id:
        type: string
      request_id:
        type: string
      time_us:
        type: number
        minimum: 0
      kind:
        type: string
        enum:
        - arrived
        - queued
        - admitted
        - local-hit
        - remote-hit
        - miss
        - evicted
        - transfer-start
        - transfer-end
        - compute-start
        - compute-end
        - selected
        - finished
        - retained
        - retention-start
      state_id:
        type:
        - string
        - 'null'
      bytes:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      device_reserved_bytes:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      host_retained_bytes:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      detail:
        type: string
      causes:
        type: array
        items:
          type: string
      phase:
        type:
        - string
        - 'null'
        enum:
        - null
        - prefill
        - decode
        - cache-build
      transfer_direction:
        type:
        - string
        - 'null'
        enum:
        - null
        - host-to-device
        - device-to-host
    allOf:
    - if:
        properties:
          kind:
            enum:
            - compute-start
            - compute-end
      then:
        properties:
          phase:
            not:
              type: 'null'
    - if:
        not:
          properties:
            kind:
              enum:
              - compute-start
              - compute-end
      then:
        properties:
          phase:
            type: 'null'
    - if:
        properties:
          kind:
            enum:
            - transfer-start
            - transfer-end
      then:
        properties:
          transfer_direction:
            not:
              type: 'null'
    - if:
        not:
          properties:
            kind:
              enum:
              - transfer-start
              - transfer-end
      then:
        properties:
          transfer_direction:
            type: 'null'
  CacheMeasurement:
    type: object
    x-owner: ExperimentObservation
    additionalProperties: false
    required:
    - event_id
    - kind
    - elapsed_us
    - bytes
    properties:
      event_id:
        type: string
      kind:
        type: string
        enum:
        - compute
        - host-to-device
        - device-to-host
        - device-copy
        - reference-check
      elapsed_us:
        type: number
        minimum: 0
      bytes:
        type: integer
        minimum: 0
        maximum: 9007199254740991
  CacheRun:
    type: object
    x-owner: ExperimentExecution
    additionalProperties: false
    required:
    - id
    - declaration
    - checkpoint
    - provenance
    - events
    - computations
    - measurements
    - outcomes
    - states
    - evidence
    properties:
      id:
        type: string
      declaration:
        $ref: '#/$defs/KVRunBinding'
      checkpoint:
        $ref: '#/$defs/ModelArtifact'
      provenance:
        $ref: '#/$defs/ExecutionProvenance'
      events:
        type: array
        items:
          $ref: '#/$defs/CacheEvent'
      computations:
        type: array
        items:
          $ref: '#/$defs/CacheComputation'
      measurements:
        type: array
        items:
          $ref: '#/$defs/CacheMeasurement'
      outcomes:
        type: object
        additionalProperties:
          $ref: '#/$defs/RunOutcome'
      states:
        type: object
        additionalProperties:
          $ref: '#/$defs/KVState'
      evidence:
        type: string
  ExecutionProvenance:
    type: object
    properties:
      python:
        type: string
      revision:
        type: string
      source_sha256:
        type: string
      sources:
        type: object
        additionalProperties:
          type: string
          pattern: ^[0-9a-f]{64}$
      backend:
        $ref: '#/$defs/ExecutionBackend'
    required:
    - python
    - revision
    - source_sha256
    - sources
    - backend
    additionalProperties: false
    x-owner: ExperimentExecution
  KVRunBinding:
    type: object
    x-owner: ExperimentSpec
    additionalProperties: false
    required:
    - model
    - system
    - workload
    - ontology_binding
    properties:
      model:
        $ref: '#/$defs/ModelArtifactReference'
      system:
        $ref: '#/$defs/KVResidencySystemConfig'
      workload:
        $ref: '#/$defs/Workload'
      ontology_binding:
        $ref: '#/$defs/OntologyBinding'
  OntologyBinding:
    type: object
    x-owner: ExperimentSpec
    x-ontology-binding: true
    additionalProperties: false
    required:
    - primary
    - related
    properties:
      primary:
        type: string
        description: Primary subject; must name an admitted ontology concept.
        x-ontology-reference: true
      related:
        type: array
        uniqueItems: true
        description: Other associated concepts; excludes the primary subject.
        items:
          type: string
          x-ontology-reference: true
  ConfigurationPreview:
    type: object
    x-owner: ExperimentSpec
    title: Configuration preview
    description: Workload transformation, mechanism and client choices over separately supplied data-plane
      input. Preview choices are not accepted execution settings; recorded evidence remains separately
      bound.
    additionalProperties: false
    required:
    - input
    - system
    - client
    properties:
      input:
        $ref: '#/$defs/WorkloadTransformationPreview'
      system:
        $ref: '#/$defs/SystemConfigurationPreview'
      client:
        $ref: '#/$defs/ClientConfigurationPreview'
