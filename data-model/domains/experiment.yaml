$defs:
  TensorObservation:
    type: object
    properties:
      axes:
        type: array
        items:
          type: string
      dtype:
        type: string
      id:
        type: string
      inputs:
        type: array
        items:
          type: string
      layer:
        type:
        - integer
        - 'null'
      positions:
        type: array
        items:
          type: integer
      request_id:
        type: string
      run_id:
        type: string
      shape:
        type: array
        items:
          type: integer
      step:
        type: integer
      values:
        type: array
        items:
          anyOf:
          - type: number
          - type: boolean
          - type: array
            items:
              type:
              - number
              - boolean
      operation:
        anyOf:
        - $ref: '#/$defs/EmbeddingOperation'
        - $ref: '#/$defs/PositionEncodingOperation'
        - $ref: '#/$defs/NormalizationOperation'
        - $ref: '#/$defs/AttentionOperation'
        - $ref: '#/$defs/ResidualAdditionOperation'
        - $ref: '#/$defs/FeedForwardOperation'
        - $ref: '#/$defs/OutputProjectionOperation'
        - $ref: '#/$defs/TokenizerOperation'
        - $ref: '#/$defs/KVStateOperation'
    required:
    - axes
    - dtype
    - id
    - inputs
    - layer
    - positions
    - request_id
    - run_id
    - shape
    - step
    - values
    - operation
    additionalProperties: false
    x-owner: ExperimentObservation
  KVExperimentInput:
    type: object
    x-owner: InferenceRequest
    additionalProperties: false
    required:
    - system
    - workload
    - ontology_binding
    properties:
      system:
        $ref: '#/$defs/KVResidencySystemConfig'
      workload:
        $ref: '#/$defs/Workload'
      ontology_binding:
        $ref: '#/$defs/OntologyBinding'
  CacheEvent:
    type: object
    x-owner: ExperimentEvent
    additionalProperties: false
    required:
    - event_id
    - request_id
    - time_us
    - kind
    - state_id
    - bytes
    - device_reserved_bytes
    - host_retained_bytes
    - detail
    - causes
    - phase
    - transfer_direction
    properties:
      event_id:
        type: string
      request_id:
        type: string
      time_us:
        type: number
        minimum: 0
      kind:
        type: string
        enum:
        - arrived
        - queued
        - admitted
        - local-hit
        - remote-hit
        - miss
        - evicted
        - transfer-start
        - transfer-end
        - compute-start
        - compute-end
        - selected
        - finished
        - retained
        - retention-start
      state_id:
        type:
        - string
        - 'null'
      bytes:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      device_reserved_bytes:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      host_retained_bytes:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      detail:
        type: string
      causes:
        type: array
        items:
          type: string
      phase:
        type:
        - string
        - 'null'
        enum:
        - null
        - prefill
        - decode
        - cache-build
      transfer_direction:
        type:
        - string
        - 'null'
        enum:
        - null
        - host-to-device
        - device-to-host
    allOf:
    - if:
        properties:
          kind:
            enum:
            - compute-start
            - compute-end
      then:
        properties:
          phase:
            not:
              type: 'null'
    - if:
        not:
          properties:
            kind:
              enum:
              - compute-start
              - compute-end
      then:
        properties:
          phase:
            type: 'null'
    - if:
        properties:
          kind:
            enum:
            - transfer-start
            - transfer-end
      then:
        properties:
          transfer_direction:
            not:
              type: 'null'
    - if:
        not:
          properties:
            kind:
              enum:
              - transfer-start
              - transfer-end
      then:
        properties:
          transfer_direction:
            type: 'null'
  CacheMeasurement:
    type: object
    x-owner: ExperimentObservation
    additionalProperties: false
    required:
    - event_id
    - kind
    - elapsed_us
    - bytes
    properties:
      event_id:
        type: string
      kind:
        type: string
        enum:
        - compute
        - host-to-device
        - device-to-host
        - device-copy
        - reference-check
      elapsed_us:
        type: number
        minimum: 0
      bytes:
        type: integer
        minimum: 0
        maximum: 9007199254740991
  CacheRun:
    type: object
    x-owner: ExperimentExecution
    additionalProperties: false
    required:
    - id
    - declaration
    - checkpoint
    - provenance
    - events
    - computations
    - measurements
    - outcomes
    - states
    - evidence
    properties:
      id:
        type: string
      declaration:
        $ref: '#/$defs/KVRunBinding'
      checkpoint:
        $ref: '#/$defs/ModelArtifact'
      provenance:
        $ref: '#/$defs/ExecutionProvenance'
      events:
        type: array
        items:
          $ref: '#/$defs/CacheEvent'
      computations:
        type: array
        items:
          $ref: '#/$defs/CacheComputation'
      measurements:
        type: array
        items:
          $ref: '#/$defs/CacheMeasurement'
      outcomes:
        type: object
        additionalProperties:
          $ref: '#/$defs/RunOutcome'
      states:
        type: object
        additionalProperties:
          $ref: '#/$defs/KVState'
      evidence:
        type: string
  ExecutionProvenance:
    type: object
    properties:
      python:
        type: string
      revision:
        type: string
      source_sha256:
        type: string
      sources:
        type: object
        additionalProperties:
          type: string
          pattern: ^[0-9a-f]{64}$
      backend:
        $ref: '#/$defs/ExecutionBackend'
    required:
    - python
    - revision
    - source_sha256
    - sources
    - backend
    additionalProperties: false
    x-owner: ExperimentExecution
  KVRunBinding:
    type: object
    x-owner: ExperimentExecution
    additionalProperties: false
    required:
    - model
    - system
    - workload
    - ontology_binding
    properties:
      model:
        $ref: '#/$defs/ModelArtifactReference'
      system:
        $ref: '#/$defs/KVResidencySystemConfig'
      workload:
        $ref: '#/$defs/Workload'
      ontology_binding:
        $ref: '#/$defs/OntologyBinding'
  OntologyBinding:
    type: object
    x-owner: ExperimentSpec
    x-ontology-binding: true
    additionalProperties: false
    required:
    - primary
    - related
    properties:
      primary:
        type: string
        description: Primary subject; must name an admitted ontology concept.
        x-ontology-reference: true
      related:
        type: array
        uniqueItems: true
        description: Other associated concepts; excludes the primary subject.
        items:
          type: string
          x-ontology-reference: true
  ExecutionReplayInput:
    type: object
    x-owner: ExperimentExecution
    additionalProperties: false
    required:
    - record_json
    properties:
      record_json:
        type: string
        title: Exported evidence
        description: Exact exported JSON bytes; preserve numeric lexemes for replay.
