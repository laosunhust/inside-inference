version: 1
approval:
  source: "Project-owner instruction in this conversation: \"once we are in better shape, we need to lock\
    \ ontology. but not yet. let's update accordingly.\" Follows approval of 12-file warnings and an 18-file\
    \ maximum. Additional owner response on 2026-10-10: \"Approve references/ exclusion\". Project-owner\
    \ instruction on 2026-10-10: \"let's go ahead. we should also ensure governance ; that is, we need\
    \ to check the ontology_binding and enforce those rules and provide useful feedback when some binding\
    \ is invented without actual ontology\". Project-owner instruction on 2026-10-10: \"please also try\
    \ to audit other frontend pages to see how to enforce SSOT and add governance if necessary\"; requests\
    \ shared authority for lab setup and ontology owners. Project-owner instruction on 2026-10-10: \"\
    let's remove depends_on . I don't think it's valuable.\" Project-owner instruction on 2026-10-10:\
    \ \"intro-page , help, check should all be hidden\" and \"freeze the public interface of make help\
    \ as governance boundary ... I don't want ad hoc public targets\". Project-owner instruction in this\
    \ conversation: \"efficient harness is also essential governance boundary ; we need tests, but tests\
    \ need to be scoped properly\"; requests another test audit and consolidation of integration setup.\
    \ Project-owner instruction in this conversation: \"Declarations and ontology -> absolutely needed,\
    \ but I doubt if we need 2.6 seconds there. are there wasteful algorithms?\" and \"Governance, approval\
    \ locks, harness boundaries ... I still doubt implementation efficiency.\" Owner instruction in this\
    \ conversation: \"add governance for unit test do not exceed 10 seconds, integ test for 100 seconds\
    \ and explicitly request agent to check for efficiency, redundancy and ROI issues before asking owner\
    \ for relaxing this.\" Owner instruction on 2026-10-10: \"ok. let's proceed with what you suggested\
    \ in I\u2019d proceed in this order\", following the explicit proposal to preserve evaluation history\
    \ and add protected checker/tests. Owner response on 2026-10-11: \"Approve locking the theme check\"\
    . Owner instruction on 2026-10-11: add a clear AGENTS.md Development obligation for UI, \"Show, dont'\
    \ tell\". Owner instruction on 2026-10-11: \"fix the interface, adapt implementation to interface,\
    \ and add the interface to governance boundary ... only one HTTP, with two runtimes.\" Owner instruction\
    \ on 2026-10-11: SSOT is the highest Development philosophy; ignore backward compatibility during\
    \ development, emphasize forward compatibility, and prefer deletion of superseded paths. Owner instruction\
    \ on 2026-10-11: \"ok. let's go ahead and make changes accordingly. feels like primarily deletion/consolidation.\"\
    , approving removal of unused Lambda/S3 paths, transport-interface consolidation and enforcement,\
    \ test-efficiency improvements, and clarification that feature-development SSOT priority does not\
    \ override governance or evaluations. Owner instruction on 2026-10-11: \"right. let's continue deleting.\
    \ we don't truly need speed up here for this tiny LLM.\", following explicit agreement to delete CUDA\
    \ and native website compute, adopt browser-only operation execution and retain native component testing.\
    \ Owner instruction on 2026-10-11: \"update AGENTS.md to delete proposals after they are complete,\
    \ and also delete those completed or effectively completed proposals.\" Owner reply on 2026-10-11:\
    \ \"Approve the fixture fix and hash update\" for the isolated governance evaluation fixture supersedes\
    \ bug. Owner instruction on 2026-10-12: local and public website must share one architecture, with\
    \ only runtime differences; make this a clear AGENTS.md rule and fill context/development-tooling\
    \ gaps first. Owner responses on 2026-10-12: Approve the scoped browser-boundary changes; Approve\
    \ the model-artifact allowance. Owner reply on 2026-10-12: sure let's apply. we need to delete; approving\
    \ the scoped response-validation deletion and hash update. Owner reply on 2026-10-12: Approve the\
    \ scoped map enforcement changes. Owner instruction on 2026-10-12: add a special rule for docs/local,\
    \ distinguish repository warnings, and update AGENTS.md to require agent handling without routine\
    \ owner escalation. Owner reply on 2026-10-13: Approve the scoped unified-execution checks. Owner\
    \ reply on 2026-10-13: \"you have the permission. please continue.\" Approves both pending shared-engine\
    \ boundary and recursive theme enforcement requests. Owner reply on 2026-10-13: \"Approve the scoped\
    \ deletion enforcement changes\". Owner response: \"Approve the scoped capability-reference fix\"\
    . Owner response: \"Approve the endpoint-independent fixture fix\". Owner response on 2026-10-13:\
    \ \"Approve the scoped concept-control enforcement changes\". Owner response on 2026-10-13: \"Approve\
    \ the scoped tiered-map enforcement changes\". Owner reply on 2026-10-13: \"I approve, and let's\
    \ get started.\" authorizing first-principles equation coverage and code-span checks in governance\
    \ with associated lock hash updates; confirmed by \"allow the action. let's apply.\" Owner instruction\
    \ on 2026-10-13: \"deletion/consolidation that do not break the purpose is almost always welcome.\
    \ this is especially true for SSOT cleanups. Examples include what we just did: converting multiple\
    \ languages into one language. let's continue\", following the agreed plan to replace C/WASM and\
    \ JavaScript model execution with one NumPy Python engine and delete the C code."
  scope: 'Narrow locks to AGENTS.md, governance limits, enforcement and its regression tests. Remove Makefile
    and ontology/data-model manifest locks; enforce workflow dependencies structurally. Ontology content
    remains unlocked. Retain approved folder and file-size limits. This approval does not authorize future
    policy changes. Additional authorization on 2026-10-10 allows only references/ to be excluded from
    the authored inventory. Extend contracts.py, generate_data_models.py, compile_validators.mjs and test_governance.py
    only to admit ontology bindings and uniquely owned operations, generate shared validators, and test
    rejection. No additional constitution, limits, or lock-inventory changes. Extend governance frontend-reference
    admission and its regression tests for this audit; register frontend.py in the protected enforcement
    inventory and wire it into __main__.py. No limit or constitution changes. Remove only the ontology
    depends_on field and cross-owner reference allowlist from generate_data_models.py; retain ownership,
    reference existence, cycle and other admission checks. Freeze public workflow names to setup, serve-intro,
    test and test-integration in the existing locked make_interface.py; keep help callable but unlisted
    and rename check/intro-page with underscores. Extend its locked regression tests. Makefile recipes
    remain editable and internal targets remain extensible. For this harness audit, establish test-scope
    obligations in AGENTS.md, add the locked harness scope checker and its regression tests, wire scope
    admission and Makefile enforcement, and relocate the frontend build assertion into integration. No
    numerical, parity or admission coverage may be removed; file limits and public workflow names remain
    unchanged. For this efficiency request, optimize repeated schema meta-validation in generate_data_models.py
    using bounded content-keyed successful validation, preserving standard validation and all semantic
    admission checks. No policy, limit, lock-inventory or public-workflow changes. The same efficiency
    request covers structured.py: reuse successful strict YAML parses by exact source content, always
    reread files and return detached copies; preserve duplicate-key, alias and finite-value rejection.
    Add whole-workflow wall-time limits, protected budget enforcement, constitution efficiency-review
    obligation, Makefile routing checks and regression tests. No other limits or public target names change.
    Replace single-record evaluation admission with preserved criteria/results, active reference and Git-history
    checks. Update evaluation.py, locks.py, test_governance.py and add/protect tests/integration/test_evaluation_history.py.
    Record the migration Git anchor; no constitution, limits, or public workflow changes. Owner approval
    on 2026-10-11 adds scripts/build/theme.py and tests/unit/test_theme.py to the protected inventory,
    updating only locks.py and this manifest for that scope. Additional owner authorization on 2026-10-11
    adds the show-dont-tell UI obligation under Development in AGENTS.md and refreshes only its recorded
    hash; no other enforcement or limit changes. Establish one OpenAPI-driven WSGI application and generated
    socket/Lambda runtime bridges; extend generate_data_models.py, add/protect http_transport.py and governance/http.py,
    wire __main__.py, protect test_http_boundary.py, and update locks.py. No constitution, limits, or
    public workflow changes. Additional owner authorization on 2026-10-11 updates only AGENTS.md Development
    principles for SSOT, compatibility and removal of superseded implementations, and its recorded hash.
    No lock inventory, limits or enforcement changes. This authorization covers AGENTS.md clarification,
    scripts/build/http_transport.py deletion and generated client, scripts/check/governance/http.py and
    tests/unit/contracts/test_http_boundary.py boundary enforcement, and scripts/build/structured.py equivalent
    strict YAML admission using LibYAML. No limit or lock-inventory changes. Browser-only cutover: update
    the existing transport generator and declaration generator, execution-boundary admission/tests, and
    evaluation evidence admission/tests so retired source evidence remains recoverable in Git without
    rewriting historical records. Budgets and protected inventory remain unchanged. Additional owner authorization
    covers only the proposal lifecycle obligation in AGENTS.md and its recorded hash; retire completed
    or superseded proposals and repair links while retaining evaluation evidence. No enforcement, inventory
    or limit changes. Additional authorization fixes only the isolated evaluation fixture in tests/unit/contracts/test_governance.py
    and its hash; no governance rule changes. Owner authorization on 2026-10-12 adds only the local/public
    parity obligation to AGENTS.md Development and updates its recorded hash. No enforcement, lock inventory
    or limit changes. Extend only the browser transport generator, boundary checker and its tests for
    declared model loading/execution. Add only a 32 MiB binary-model allowance under data/models/artifacts/
    in limits, structure enforcement and its existing regression tests. Update corresponding hashes; no
    lock inventory or other limit changes. Remove production response-schema validation from scripts/build/http_transport.py
    and update only its hash; retain request admission and validate responses in the harness. No limits
    or inventory changes. Extend only frontend.py and test_governance.py for declared system-map references,
    unique navigation homes, lab/operation coverage, relationships and handwritten map rejection; refresh
    only those hashes. No limits or inventory changes for the map work. Subsequent explicit owner instruction
    authorizes excluding only docs/local in limits.yaml, adding the repository-warning prefix in governance/__main__.py,
    the proactive warning obligation in AGENTS.md, regression coverage in test_governance.py and their
    corresponding hashes. Numerical limits and lock inventory remain unchanged. Extend only frontend.py
    and test_governance.py to enforce one declared numerical runtime and conceptual graph, operation homes
    and graph edges, and reject handwritten diagram labels and retired browser engines; refresh only their
    hashes. No limits or inventory changes. Update only scripts/build/http_transport.py, scripts/check/governance/http.py
    and tests/unit/contracts/test_http_boundary.py to initialize and enforce the shared browser decoder
    for request/KV operations; update scripts/build/theme.py and tests/unit/test_theme.py to enforce theme
    authority recursively. Refresh only these five hashes. No limits or lock inventory changes. Remove
    obsolete evidence-store initialization and reject retired request/storage paths in http_transport.py,
    governance/http.py and test_http_boundary.py; update only their hashes. Limits and lock inventory
    unchanged. Resolve explicitly named capability declaration roots instead of hardcoded retired RunBinding
    in generate_data_models.py; retain reference, type and default checks. Replace only the retired run
    endpoint reference in test_governance.py with the first declared operation; preserve rejection assertions.
    Extend frontend.py and test_governance.py to reject experiment controls without concept homes and
    handwritten system editors; update only their approval hashes. Limits and inventory unchanged. Replace
    frontend.py flat-map enforcement and its test_governance.py fixtures with tiered-map ownership, parent/root/cycle
    and explanation-coverage checks; update only their hashes. Limits and inventory unchanged. Admit
    optional ontology principles in generate_data_models.py and contracts.py, rejecting malformed principles,
    unknown variant conditions, dead variants, dangling bindings, symbols absent from equations, unbound
    operations, missing architecture coverage and overlapping applicable principles; add and protect
    tests/unit/contracts/test_principles.py in locks.py; refresh only these four hashes. Code-span checks
    follow with the Python engine under the same authorization. No limits or constitution changes. For
    the single Python engine, update only scripts/build/http_transport.py so the generated worker loads
    jsonschema and numpy and routes every operation through execute_json; scripts/check/governance/http.py
    to require that route, forbid other worker imports and all web fetches, and reject reintroduced C/WASM
    and JavaScript model-execution files; and tests/unit/contracts/test_http_boundary.py for those rejections.
    Refresh only these three hashes. No limits, inventory or constitution changes. Under the recorded
    code-span authorization, add scripts/check/governance/principles.py to admit exactly one balanced
    principle code span per declared principle in inside_inference sources, wire it into governance/__main__.py,
    and extend tests/unit/contracts/test_principles.py with its rejection fixtures. The marker parser lives
    in scripts/build/contracts.py so the build can publish spans without importing governance. Record the
    new module hash and refresh only __main__.py, contracts.py and test_principles.py. No limits, constitution
    or other inventory changes.'
