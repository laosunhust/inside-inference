summary: 'Removed independent detail selection in favor of generated InspectionState.surface plus observation_id.
  Declared the baseline direct in-process dispatch and enclosed its numerical graph in an execution endpoint;
  no routed, MoE, P/D or multi-node execution is claimed. Token Journey replays actual observations through
  the shared cursor, supports pause/manual cancellation, stops on edits/execution and tracks off-screen stages
  horizontally. Initial input-only strip implementation passed, but owner review changed the desired layout:
  Input/Edit and Output/Details now share styling, with one collapsed combined token sequence and no standalone
  selected-token/published-output controls. Output derives from accepted execution independently of the inspection
  cursor. Browser tests verify stable output throughout replay, exact combined sequences and step exports,
  the ann-has regression, disclosure, and native/CLI/HTTP/browser numerical parity. Earlier failures exposed
  a branch position mistakenly highlighting original source and a detail label depending on the deleted button;
  both corrected. A harness file exceeded 24 KiB during iteration; inspection checks were consolidated into
  its existing helper instead of relaxing the limit. A draft conditional schema used unsupported else; equivalent
  supported if/not/then admission was used without changing governance. Light harness passed 104 tests in 9.63s.
  Final full harness passed 104 unit and 27 integration tests plus browser parity in 89.67s. Desktop and 390px
  layouts reviewed. Replay speed is presentation pacing, not hardware timing. Future topology must come from
  resolved system declarations and execution evidence.'
