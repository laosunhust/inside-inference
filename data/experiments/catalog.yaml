          ontology_binding:
            primary: KVCache
            related:
            - ModelExecution
        - control: kv_cache
          value:
            device_kv_bytes: 2560
            host_kv_bytes: 32768
            retention_policy: whole-prefix-lru
          ontology_binding:
            primary: KVCache
            related:
            - KVState
        - control: scheduling
          value:
            max_active_requests: 1
          ontology_binding:
            primary: RequestScheduling
            related: []
        - control: transfer
          value:
            link_bytes_per_us: 100
            link_latency_us: 10
          ontology_binding:
            primary: StateTransfer
            related:
            - KVState
        - control: compute_service
          value:
            compute_flops_per_us: 1000
            memory_bytes_per_us: 1000
          ontology_binding:
