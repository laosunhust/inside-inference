experiments:
- id: kv-residency
  name: KV cache residency
  question: When device capacity cannot retain earlier prefixes, does retaining them in host memory avoid recomputation
    on a repeated request, and at what transfer cost?
  ontology_binding:
    primary: KVCache
    related:
    - KVState
    - RequestScheduling
    - StateTransfer
    - ComputeService
  missing_controls: []
  contract:
    target_regime: Exact whole-prefix reuse for the 8K checkpoint in two logical memory pools, with FIFO admission
      of full maximum-sequence reservations and one serialized service resource.
    preserved: Actual computed K/V, checkpoint and tokenizer identity, causal positions, raw-logit selection and
      termination. A hit still executes a real forward step; logical hit, local hit, remote hit and miss stay distinct,
      and active state is never silently evicted.
    omissions: No partial-prefix paging, batching, compute/transfer overlap, preemption or network fabric. Compute
      service is max(FLOPs / compute rate, logical bytes / memory rate); transfer is latency plus bytes over link
      rate. Weights and workspace sit outside the KV budget.
    evidence_plan: Compare cached and uncached execution; reject identity, mask, position and context mismatches;
      cover cold, warm, changed-prefix and eviction cases, resource conservation, backpressure, exact logical replay
      and browser headless/interactive parity.
    limits: Declared service rates are hypotheses for controlled sensitivity, not a calibrated accelerator model.
      Browser wall time is not HBM, PCIe or GPU timing, and screening real hardware needs calibration.
  sources: []
  evidence:
  - docs/research/kv-residency-2026-10-09.md
  variants:
  - label: Configure without host retention
    input:
      execution:
        experiments:
        - control: model
          value: tinyllm-8k
          ontology_binding:
            primary: ModelArtifact
            related: []
        - control: kv_reuse
          value: true
          ontology_binding:
            primary: KVCache
            related:
            - ModelExecution
        - control: kv_cache
          value:
            device_kv_bytes: 2560
            host_kv_bytes: 0
            retention_policy: whole-prefix-lru
          ontology_binding:
            primary: KVCache
            related:
            - KVState
        - control: scheduling
          value:
            max_active_requests: 1
          ontology_binding:
            primary: RequestScheduling
            related: []
        - control: transfer
          value:
            link_bytes_per_us: 100
            link_latency_us: 10
          ontology_binding:
            primary: StateTransfer
            related:
            - KVState
        - control: compute_service
          value:
            compute_flops_per_us: 1000
            memory_bytes_per_us: 1000
          ontology_binding:
            primary: ComputeService
            related: []
      workload:
        kind: fixed-arrivals
        requests:
        - request_id: r1
          arrival_us: 0
          request:
            text: the ball.
            generation:
              max_new_tokens: 16
              selection: greedy-lowest-id-tie
              stopping: model-end-or-budget
        - request_id: r2
          arrival_us: 10000
          request:
            text: the cup.
            generation:
              max_new_tokens: 16
              selection: greedy-lowest-id-tie
              stopping: model-end-or-budget
        - request_id: r3
          arrival_us: 20000
          request:
            text: the ball.
            generation:
              max_new_tokens: 16
              selection: greedy-lowest-id-tie
              stopping: model-end-or-budget
  - label: Configure with host retention
    input:
      execution:
        experiments:
        - control: model
          value: tinyllm-8k
          ontology_binding:
            primary: ModelArtifact
            related: []
        - control: kv_reuse
