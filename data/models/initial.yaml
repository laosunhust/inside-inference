workload:
  requests:
  - request_id: r1
    arrival_us: 0
    request:
      text: a little cat had a red ball.
      generation:
        max_new_tokens: 32
        selection: greedy-lowest-id-tie
        stopping: model-end-or-budget
  kind: fixed-arrivals
execution:
  experiments:
  - control: model
    value: tinyllm-4m
    ontology_binding:
      primary: ModelArtifact
      related: []
  - control: kv_reuse
    value: false
    ontology_binding:
      primary: KVCache
      related:
      - ModelExecution
